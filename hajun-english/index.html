let view='home',chId=1,chapterTab='story',advanced=false,translation=false,gloss=null,listenHelp=false,growthReveal=false,growthModel=false,growthDraft=null,growthDraftPersonal=null,quest=null,placement=null,review=null,passageGame=null,voiceCache=[],speakerRun=0,toastTimer=null;
let audioPlayer=null; const ephemeralAudio={};
const AUDIO_DB='hajun-narration-store';
function openAudioDb(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('no indexedDB'));const request=indexedDB.open(AUDIO_DB,1);request.onupgradeneeded=()=>{request.result.createObjectStore('files');};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});}
async function storeAudio(id,blob){const db=await openAudioDb();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}});}
async function readAudio(id){if(ephemeralAudio[id])return ephemeralAudio[id];try{const db=await openAudioDb();return await new Promise((resolve,reject)=>{const tx=db.transaction('files','readonly');const r=tx.objectStore('files').get(id);r.onsuccess=()=>{db.close();resolve(r.result||null)};r.onerror=()=>{db.close();reject(r.error)}})}catch(e){return null;}}
async function playUploadedAudio(id){const file=await readAudio(id);if(!file){notify('저장된 원어민 음원이 없어요. MP3 파일을 추가하거나 기본 음성을 이용하세요.');return;}stopVoice();const url=URL.createObjectURL(file);const player=new Audio(url);audioPlayer=player;player.playbackRate=Number(state.rate)||1;player.onended=()=>{URL.revokeObjectURL(url);if(audioPlayer===player)audioPlayer=null;};player.onerror=()=>{URL.revokeObjectURL(url);notify('음원이 재생되지 않습니다. 다른 MP3를 추가해 주세요.');};try{await player.play()}catch(e){URL.revokeObjectURL(url);notify('재생할 수 없어요. 재생 버튼을 한 번 더 눌러주세요.');}}
function playNarration(id,name,fallback){stopVoice();const player=new Audio(audioFile(id,name));audioPlayer=player;player.playbackRate=Number(state.rate)||1;let failed=false;const fail=()=>{if(failed)return;failed=true;if(audioPlayer===player)audioPlayer=null;notify('음원 연결이 어려워 기기 음성으로 읽습니다.');if(fallback)speak(fallback);};player.onended=()=>{if(audioPlayer===player)audioPlayer=null;};player.onerror=fail;player.play().catch(fail);}

function getVoices(){try{return window.speechSynthesis?.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang))||[];}catch(e){return [];}}
function scoreVoice(v){let z=0,name=v.name||'',accent=state.accent||'en-GB';if(/natural|premium|enhanced|neural|siri/i.test(name))z+=58;if(/samantha|daniel|karen|ava|allison|serena|google us english|google uk english|microsoft.*online/i.test(name))z+=42;if(v.localService)z+=8;if(v.lang?.toLowerCase()===accent.toLowerCase())z+=42;if(v.default)z+=3;return z;}
function selectedVoice(){let list=getVoices();if(!list.length)return null;let explicit=list.find(v=>v.voiceURI===state.voice || v.name===state.voice);return explicit||list.slice().sort((a,b)=>scoreVoice(b)-scoreVoice(a))[0];}
function speak(text,cb){const ss=window.speechSynthesis;if(!ss||!window.SpeechSynthesisUtterance){notify('이 브라우저는 영어 음성을 지원하지 않아요. 음성 설정을 확인해 주세요.');return false;}stopVoice();const id=++speakerRun;const u=new SpeechSynthesisUtterance(String(text));const voice=selectedVoice();if(voice){u.voice=voice;u.lang=voice.lang;}else u.lang=state.accent||'en-GB';u.rate=Number(state.rate)||1;u.pitch=1;u.volume=1;u.onend=()=>{if(speakerRun===id&&cb)cb();};u.onerror=(e)=>{if(speakerRun!==id)return;notify('음성이 재생되지 않았어요. 다른 영어 목소리를 선택하거나 보호자가 읽어 주세요.');};try{ss.speak(u);return true;}catch(e){notify('음성을 재생할 수 없습니다.');return false;}}
function speakLines(lines){const ss=window.speechSynthesis;if(!ss)return notify('음성을 지원하지 않는 브라우저입니다.');stopVoice();const run=++speakerRun;const voice=selectedVoice();let i=0;const clear=()=>document.querySelectorAll('.reading-now').forEach(e=>e.classList.remove('reading-now'));const next=()=>{if(run!==speakerRun)return clear();if(i>=lines.length)return clear();const idx=i;const u=new SpeechSynthesisUtterance(lines[i++]);if(voice){u.voice=voice;u.lang=voice.lang;}else u.lang=state.accent||'en-GB';u.rate=Number(state.rate)||1;u.onstart=()=>{if(run!==speakerRun)return;clear();let e=document.querySelector(`[data-read-line="${idx}"]`);if(e)e.classList.add('reading-now');};u.onend=next;u.onerror=()=>{clear();if(run===speakerRun)notify('일부 문장이 재생되지 않았어요. 음성 설정을 확인해 주세요.');};try{ss.speak(u)}catch(e){clear();notify('음성을 재생할 수 없어요.');}};next();}

function grammarSignals(text){const match=[];const t=text.toLowerCase();for(const [re,desc] of [[/\bbecause\b/,'because: 이유'],[/\bbut\b/,'but: 대조'],[/\bwhen\b/,'when: 시점'],[/\bif\b/,'if: 조건'],[/\b(was|were)\b/,'was/were: be동사 과거형'],[/\b(could|would|should|might|must)\b/,'조동사: 가능성·필요'],[/\b(had|has|have)\b/,'have 계열 동사'],[/\b(is|are|am)\b/,'be동사: 상태·정체']]){if(re.test(t))match.push(desc);}return match.slice(0,5)}

 const record={kind:'chapter',id:Date.now()+'_'+Math.random().toString(36).slice(2,6),chapter:c.id,at:Date.now(),correct,attempted:total,skipped,assisted:results.filter(item=>item.help).length,passed,mode:state.level,earned:bonus,results,durationSec:Math.round((Date.now()-quest.started)/1000),joy:null};

function buildPassageQuestions(text){
 const known=new Set(CHAPTERS.flatMap(c=>c.words.map(x=>x[0].toLowerCase())));
 const stop=new Set('this that with have from they them then when where what which while into your their were been does more than only some very will would could should there these those after before because about harry hagrid ron hermione hogwarts'.split(' '));
 const sentences=text.match(/[^.!?]+[.!?]?/g)?.map(s=>s.trim()).filter(x=>x.length>8)||[text];
 let pool=[];
 sentences.forEach((sentence,si)=>{
  for(const match of sentence.matchAll(/\b[a-zA-Z]{4,}\b/g)){
   const w=match[0].toLowerCase();if(stop.has(w))continue;
   pool.push({sentence,si,word:match[0],index:match.index,priority:known.has(w)?0:1});
  }
 });
 pool.sort((a,b)=>a.priority-b.priority || a.si-b.si || a.index-b.index);
 let targets=[],seen=new Set();for(const p of pool){if(!seen.has(p.word.toLowerCase())){targets.push(p);seen.add(p.word.toLowerCase());}if(targets.length>=3)break;}
 const possible=CHAPTERS.flatMap(c=>c.words.map(w=>w[0])).filter((w,i,a)=>a.indexOf(w)===i);
 return targets.map((p,qi)=>{
  let distractors=possible.filter(w=>w.toLowerCase()!==p.word.toLowerCase()&&!seen.has(w.toLowerCase())&&w.length>3);
  distractors.sort((a,b)=>Math.abs(a.length-p.word.length)-Math.abs(b.length-p.word.length)||a.localeCompare(b));
  distractors=distractors.slice((qi*5)%Math.max(1,distractors.length-4),(qi*5)%Math.max(1,distractors.length-4)+3);
  if(distractors.length<3)distractors=possible.filter(w=>w.toLowerCase()!==p.word.toLowerCase()).slice(0,3);
  const variants=[p.word,...distractors];const order=[[2,0,3,1],[1,3,0,2],[0,2,1,3]][qi%3];const opts=order.map(i=>variants[i]);const a=order.indexOf(0);
  return {masked:p.sentence.slice(0,p.index)+' _____ '+p.sentence.slice(p.index+p.word.length),word:p.word,opts,a,original:p.sentence};
 });
}

  case'growthspoken':{state.growth=state.growth||{};state.growth[chId]={...(state.growth[chId]||{}),spoken:true,spokenAt:Date.now()};save();render();notify('말하기 연습을 기록했어요.');break;}
  case'savegrowth':{const answer=(el('#growthAnswer')?.value||'').trim().slice(0,240);if(!answer)return notify('짧은 영어 문장을 먼저 적어 보세요.');state.growth=state.growth||{};state.growth[chId]={...(state.growth[chId]||{}),answer,at:Date.now()};growthDraft=null;save();render();notify('내 영어 문장을 저장했어요.');break;}
  case'savepersonal':{const personal=(el('#personalAnswer')?.value||'').trim().slice(0,240);if(!personal)return notify('내 생활을 영어 한 문장으로 적어 보세요.');state.growth=state.growth||{};state.growth[chId]={...(state.growth[chId]||{}),personal,personalAt:Date.now()};growthDraftPersonal=null;save();render();notify('내 생활 문장을 저장했어요.');break;}
  case'playaudio':playUploadedAudio(chId);break;
  case'saychapterbook':{const t=el('#chapterBookInput')?.value?.trim()||state.bookPassages?.[chId];if(t)speak(t);else notify('먼저 원서 구절을 입력해 주세요.');break;}
  case'savechapterbook':{const t=(el('#chapterBookInput')?.value||'').trim().slice(0,600);state.bookPassages=state.bookPassages||{};state.bookPassages[chId]=t;state.excerpt=t.slice(0,350);save();render();notify('이 기기 안에 원서 구절을 저장했어요.');break;}
  case'chapterbookquest':{const t=el('#chapterBookInput')?.value?.trim()||state.bookPassages?.[chId];if(!t)return notify('먼저 원서 구절을 저장하세요.');state.excerpt=t.slice(0,350);save();startPassageQuest();break;}
   case'sayphrase':{const c=getChapter(chId);playNarration(c.id,'phrase',c.phrase[0]);break;}
  case'sayword':if(gloss)speak(gloss.original||gloss.word);break;
  case'closegloss':gloss=null;render();break;
  case'stopvoice':stopVoice();notify('음성을 멈췄어.');break;
  case'translate':translation=!translation;render();break;
  case'flipreview':if(review){review.flipped=!review.flipped;render();}break;
  case'freereview':initReview(true);render();break;
  case'reviewhard':gradeReview(false);break;
  case'reviewgood':gradeReview(true);break;
  case'sayreview':if(review?.ids.length)speak(state.words[review.ids[review.idx]].en);break;
  case'sayreviewstory':if(review?.ids.length){const w=state.words[review.ids[review.idx]],sentence=getChapter(w.chapter).story.find(s=>s.toLowerCase().includes(w.en.toLowerCase()));speak(sentence||w.en);}break;
  case'startpassagequest':startPassageQuest();break;
  case'passagenext':passageGame.idx++;passageGame.feedback=null;render();break;
  case'repeatpassage':passageGame=null;go('passage');setTimeout(startPassageQuest,0);break;
  case'savepassage':{let s=el('#excerptInput')?.value||'';state.excerpt=s.slice(0,350);save();gloss=null;render();notify('이 브라우저에만 문장을 저장했어.');break;}
  case'saypassage':{let s=el('#excerptInput')?.value||state.excerpt;if(s?.trim())speak(s.slice(0,350));else notify('먼저 원서 문장을 적어 줘.');break;}
  case'clearpassage':if(confirm('입력한 원서 문장을 비울까요?')){state.excerpt='';gloss=null;save();render();}break;
  case'savegloss':{if(!gloss)return;let meaning=el('#customMeaning')?.value?.trim();if(!meaning)return notify('단어 뜻을 적어 줘.');state.customGloss[gloss.word]=meaning.slice(0,100);save();render();notify('단어 뜻을 저장했어.');break;}
  case'testvoice':speak('The secret door is open. Are you ready for your next adventure?');break;
  case'copyreport':copy(reportText());break;
  case'exportdata':fileDownload('hajun-magic-english-backup.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');notify('학습 기록 백업 파일을 저장했어.');break;
  case'importdata':el('#importFile')?.click();break;
  case'resetdata':if(confirm('정말 이 기기의 모든 학습 기록과 입력한 원서 문장을 초기화할까요? 되돌릴 수 없습니다.')){state=blank();save();placement=null;quest=null;review=null;go('home');notify('초기화했어.');}break;
  default:break;
 }
}
document.addEventListener('click',handleClick);
document.addEventListener('change',async e=>{
 if(e.target.id==='voiceSelect'){state.voice=e.target.value;save();notify('이 목소리로 영어를 읽을게.');}
 if(e.target.id==='accentSelect'){state.accent=e.target.value;state.voice='';save();render();notify('발음 기준을 변경했어요. 가능하면 해당 지역의 영어 음성을 선택합니다.');}
 if(e.target.id==='chapterAudioFile'){const f=e.target.files?.[0];if(!f)return;if(f.size>15*1024*1024)return notify('15MB 이하 오디오 파일을 선택해 주세요.');if(!f.type.startsWith('audio/'))return notify('오디오 파일을 선택해 주세요.');ephemeralAudio[chId]=f;try{await storeAudio(chId,f);notify('음원이 이 기기에 저장되었어요. 원어민 MP3 듣기를 눌러보세요.');}catch(err){notify('이 브라우저에서는 영구 저장이 어렵지만 이번 사용 중에는 들을 수 있어요.');} }
 if(e.target.id==='rateRange'){state.rate=Number(e.target.value);save();render();}
 if(e.target.id==='importFile'){
  const f=e.target.files?.[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(d.v!==2||typeof d.xp!=='number'||!Array.isArray(d.history)||typeof d.words!=='object'||!d.words||typeof d.chapters!=='object'||!d.chapters)throw Error('invalid');if(!confirm('현재 기기의 학습 기록을 이 백업 파일로 덮어쓸까요?'))return;state={...blank(),...d};state.excerpt=String(state.excerpt||'').slice(0,350);state.history=state.history.slice(-300);save();go('parent');notify('백업을 가져왔어.');}
  catch(err){notify('지원되지 않는 백업 파일입니다.');}
 }
});
document.addEventListener('input',e=>{if(e.target.id==='writeAnswer'&&quest)quest.typed=e.target.value;if(e.target.id==='growthAnswer')growthDraft=e.target.value;if(e.target.id==='personalAnswer')growthDraftPersonal=e.target.value;if(e.target.id==='rateRange'){const value=Number(e.target.value);let description=e.target.parentElement?.querySelector('.fine');if(description)description.textContent=`${value.toFixed(2)}배속 · 너무 느리면 부자연스러울 수 있어요.`;}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='writeAnswer'&&view==='quest'){e.preventDefault();submitAnswer();}});
if('speechSynthesis' in window){try{speechSynthesis.addEventListener('voiceschanged',()=>{voiceCache=getVoices();if(view==='settings')render();});}catch(e){}}
function renderGrowth(c){
 const task=GROWTH_TASKS[c.id-1],record=state.growth?.[c.id]||{};
 return `<div class="eyebrow">GROW WITH THE STORY · ${stageLabel(c.id)}</div><h2 class="title">🌱 듣고 이해한 이야기를 내 영어로 말해요</h2><p class="subtitle">한 장면을 3일에 나누어 연습해요. 짧은 문장 하나를 스스로 표현하면 충분합니다.</p>
 <div class="growth-grid"><div class="growth-step"><strong>1일차 · 그림 보고 듣기</strong><p>그림을 보고 무슨 일이 일어날지 생각한 뒤, 글을 보지 않고 한 번 들어요.</p></div><div class="growth-step"><strong>2일차 · 읽고 찾기</strong><p>영어 문장을 읽으며 오늘의 단어와 사람·장소·행동을 찾아요.</p></div><div class="growth-step"><strong>3일차 · 말하고 쓰기</strong><p>질문에 소리 내어 답하고, 짧은 영어 한 문장을 남겨요.</p></div></div>
 <img src="${scene(c.id)}" class="listening-scene" alt="${esc(c.title)} 장면을 떠올리는 그림">${button('🎧 먼저 귀로 듣기','playgrowth','primary sm')}${button(growthReveal?'문장 접기':'영어 문장 보기','growthreveal','line sm')}
 ${growthReveal?`<div class="storybox" style="margin-top:14px"><div class="eyebrow">READ AFTER LISTENING</div><div class="english">${window.FULL_PASSAGES[c.id-1].sentences.map((line,i)=>`<p class="line-text" lang="en">${i+1}. ${esc(line)}</p>`).join('')}</div></div>`:''}
 <div class="pattern"><div class="eyebrow">이야기 속 단어</div><p>${c.words.slice(0,3).map(([word,meaning])=>`<strong lang="en">${esc(word)}</strong> ${esc(meaning)}`).join(' · ')}</p><p class="fine">먼저 뜻을 떠올려 보고, 기억이 나지 않으면 단어 탭에서 다시 확인하세요.</p></div>
 <div class="card warm" style="margin-top:17px"><strong>🎙️ ${esc(task.focus)}</strong><p class="en" lang="en">${esc(task.question)}</p><p class="fine">시작 문장: <span lang="en">${esc(task.starter)}</span></p>${button('🔊 질문 듣기','playgrowthquestion','line sm')}${button(record.spoken?'✓ 말하기 완료':'🎙️ 소리 내어 답했어요','growthspoken','gold sm')}</div>
 <div class="card" style="margin-top:14px"><label for="growthAnswer"><strong>✍️ 내 영어 문장</strong></label><p class="fine">길게 쓰지 않아도 좋아요. 이야기에서 배운 표현을 바꿔 쓰거나 내 생각을 적어 보세요.</p><textarea id="growthAnswer" class="text-area en growth-answer" lang="en" maxlength="240" placeholder="${esc(task.starter)}">${esc(growthDraft===null?(record.answer||''):growthDraft)}</textarea><div class="audio-tools">${button('💾 내 문장 저장','savegrowth','primary sm')}${button('예시 문장 보기','growthmodel','line sm')}</div>${record.answer?`<p class="growth-status">✓ 내 문장을 이 기기에 저장했어요.</p>`:''}</div>
 <div class="card soft" style="margin-top:14px"><strong>🏡 내 생활과 연결하기</strong><p class="fine">이야기에서 배운 문장 틀을 내 일상에 써 보세요.</p><p class="en" lang="en">${esc(TRANSFER_TASKS[c.id-1].question)}</p><p class="fine">시작 문장: <span lang="en">${esc(TRANSFER_TASKS[c.id-1].starter)}</span></p>${button('🔊 질문 듣기','playpersonalquestion','line sm')}<textarea id="personalAnswer" class="text-area en growth-answer" lang="en" maxlength="240" aria-label="내 생활 영어 문장" placeholder="${esc(TRANSFER_TASKS[c.id-1].starter)}">${esc(growthDraftPersonal===null?(record.personal||''):growthDraftPersonal)}</textarea>${button('💾 내 생활 문장 저장','savepersonal','primary sm')}${record.personal?`<p class="growth-status">✓ 내 생활 문장을 저장했어요.</p>`:''}</div>
 ${growthModel?`<div class="growth-model"><strong>참고할 수 있는 예시 문장</strong><p>이야기: <span class="en" lang="en">${esc(task.model)}</span></p><p>내 생활: <span class="en" lang="en">${esc(TRANSFER_TASKS[c.id-1].model)}</span></p><p class="fine">예시는 하나의 표현 방법이에요. 내 문장에 뜻이 잘 담겼는지 부모님과 이야기해 보세요.</p>${button('🎧 이야기 예시 듣기','playgrowthmodel','line sm')}${button('🎧 내 생활 예시 듣기','playpersonalmodel','line sm')}</div>`:''}
 <div class="notice green">학습 기준: 이야기에서 정보를 찾고, 그림과 질문을 바탕으로 짧게 말하고 씁니다. 이 활동만으로 학교 학년 수준이나 공인 영어 등급을 판정하지 않습니다.</div>`;
}
render();
})();

</script>
