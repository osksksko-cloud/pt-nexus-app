danger{border:0;border-radius:13px;padding:12px 18px;font-weight:900;transition:transform .15s}.primary:hover,.secondary:hover,.soft:hover{transform:translateY(-1px)}.primary{background:var(--green);color:white}.secondary{background:var(--navy);color:white}.soft{background:#edf4f1;color:var(--navy)}.danger{background:#fff0eb;color:var(--red)}.hero .primary{background:#ffe0a5;color:#463000;margin-top:22px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:17px}.mode-card,.panel{background:white;border:1px solid var(--stroke);border-radius:22px;padding:22px;box-shadow:0 7px 28px #132f3b0a}.mode-card{display:flex;flex-direction:column;gap:11px}.mode-card .emoji{width:49px;height:49px;border-radius:15px;display:grid;place-items:center;background:#ecf6fb;font-size:25px}.mode-card:nth-child(2) .emoji{background:#fff2e6}.mode-card:nth-child(3) .emoji{background:#f0eafb}.mode-card h3,.panel h3{margin:0;font-size:20px}.mode-card p,.help{color:var(--muted);font-size:14px;margin:0}.mode-card button{margin-top:auto;align-self:flex-start}.section-head{display:flex;align-items:end;justify-content:space-between;margin:27px 0 14px;gap:12px}.section-head h2{font-size:22px;margin:0}.section-head small{color:var(--muted)}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.stat{background:#fff;border:1px solid var(--stroke);border-radius:16px;padding:15px}.stat strong{display:block;font-size:25px;line-height:1.2;color:var(--navy)}.stat span{color:var(--muted);font-size:12px}.unitgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.unit{background:#fff;border:1px solid var(--stroke);padding:14px;border-radius:14px;font-size:14px}.unit b{display:block;font-size:14px}.unit small{color:var(--muted)}.divider{height:1px;background:var(--stroke);margin:18px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.tag{font-size:12px;font-weight:900;border:1px solid #d8e5e0;background:#f2f7f4;color:#4f7568;border-radius:99px;padding:5px 10px}.tag.gold{background:#fff1dc;border-color:#f7dbb3;color:#91621c}.tag.blue{background:#eef5fd;border-color:#d9e7f8;color:#4774a9}.question-shell{max-width:790px;margin:15px auto}.progress-track{height:10px;background:#e1eae5;border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#3ca78b,#a8d99b);border-radius:99px}.question{background:#fff;border:1px solid var(--stroke);border-radius:25px;padding:clamp(20px,4vw,38px);box-shadow:0 15px 45px #13334610;margin-top:18px}.question h2{font-size:clamp(21px,3vw,28px);line-height:1.55;margin:17px 0 22px;white-space:pre-line;letter-spacing:-.016em}.answers{display:grid;gap:11px}.answer{padding:15px 18px;border:2px solid var(--stroke);background:white;border-radius:13px;text-align:left;font-size:17px;font-weight:800;color:var(--ink)}.answer:hover{border-color:#91cbb5;background:#f6fcf9}.answer.selected{border-color:var(--green);background:#eaf9f1}.answer .key{display:inline-grid;place-items:center;min-width:29px;height:29px;margin-right:12px;border-radius:8px;background:#eef3f1;color:#608575}.answer.selected .key{background:var(--green);color:white}.ansinput{border:2px solid var(--stroke);border-radius:13px;padding:15px 18px;width:100%;font-size:22px;font-weight:800;outline:none;color:var(--navy)}.ansinput:focus{border-color:var(--green)}.qfooter{display:flex;gap:12px;justify-content:space-between;margin-top:25px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.confbox{margin-top:22px;padding:13px 14px;background:#f6f9f7;border-radius:13px}.confbox label{margin-right:14px;font-size:14px;display:inline-flex;align-items:center;gap:5px}.confbox input{accent-color:var(--green)}.feedback{padding:18px;background:#f1f7f4;border:1px solid #cce8da;border-radius:15px;margin-top:20px}.feedback.wrong{background:#fff7ee;border-color:#f4dfc6}.feedback b{font-size:18px}.feedback p{margin:8px 0 0}.insight{padding:14px;border-left:4px solid var(--orange);background:#fffbf3;border-radius:8px;margin:10px 0;color:#61513d}.resultmark{font-size:55px}.bigscore{font-size:52px;line-height:1.1;font-weight:900;color:var(--navy)}.barrow{display:grid;grid-template-columns:140px 1fr 58px;align-items:center;gap:12px;margin:11px 0;font-size:14px}.track{height:11px;background:#ebf0ed;border-radius:100px;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:100px}.fill.mid{background:#f1b351}.fill.low{background:#e38171}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0ee;vertical-align:top}th{color:#7d8c91;font-weight:900;font-size:12px}.status{font-weight:900}.status.ok{color:var(--green)}.status.no{color:var(--red)}.micro{font-size:12px;color:var(--muted)}.review-item{border-bottom:1px solid var(--stroke);padding:13px 0}.review-item:last-child{border-bottom:0}.review-item p{margin:6px 0}.sel{width:100%;max-width:275px;border:1px solid var(--stroke);border-radius:9px;background:white;padding:8px;color:var(--ink)}.empty{text-align:center;padding:55px 15px}.empty .emoji{font-size:55px}.footer{text-align:center;color:#8a9496;font-size:12px;margin-top:38px}.hide{display:none!important}.miniBtn{background:#fff;border:1px solid var(--stroke);padding:8px 11px;border-radius:10px;font-size:13px;font-weight:800;color:var(--ink)}.notice{font-size:13px;color:#687781;border:1px dashed #cdded8;background:#f8fcfa;border-radius:12px;padding:13px 15px}.inline-actions{display:flex;flex-wrap:wrap;gap:9px}.callout{background:#edf8f3;border:1px solid #ccebdc;padding:18px;border-radius:18px}.highlight{color:#c08327}.loader{color:var(--muted)}

<script>const DB={"version":"1.0","curriculum":"2022 개정 교육과정 참고, 자체 제작","units":[{"unit_id":"U01","term":"4-1","unit":"큰 수","domain":"수와 연산"},{"unit_id":"U02","term":"4-1","unit":"각도","domain":"도형과 측정"},{"unit_id":"U03","term":"4-1","unit":"곱셈과 나눗셈","domain":"수와 연산"},{"unit_id":"U04","term":"4-1","unit":"평면도형의 이동","domain":"도형과 측정"},{"unit_id":"U05","term":"4-1","unit":"막대그래프","domain":"자료와 가능성"},{"unit_id":"U06","term":"4-1","unit":"규칙 찾기","domain":"변화와 관계"},{"unit_id":"U07","term":"4-2","unit":"분수의 덧셈과 뺄셈","domain":"수와 연산"},{"unit_id":"U08","term":"4-2","unit":"삼각형","domain":"도형과 측정"},{"unit_id":"U09","term":"4-2","unit":"소수의 덧셈과 뺄셈","domain":"수와 연산"},{"unit_id":"U10","term":"4-2","unit":"사각형","domain":"도형과 측정"},{"unit_id":"U11","term":"4-2","unit":"꺾은선그래프","domain":"자료와 가능성"},{"unit_id":"U12","term":"4-2","unit":"다각형","domain":"도형과 측정"}],"questions":[{"id":"M4-U01-01","grade":4,"term":"4-1","unit_id":"U01","unit":"큰 수","domain":"수와 연산","level":1,"skill":"큰 수의 자릿값","stem":"400만과 7만을 합하면 얼마인가요?","kind":"input","options":[],"answer":"4070000","explanation":"400만=4,000,000이고 7만=70,000이므로 4,070,000입니다.","hint":"만은 10,000을 뜻해요.","misconception":"자릿값 혼동","role":"diagnostic"},{"id":"M4-U01-02","grade":4,"term":"4-1","unit_id":"U01","unit":"큰 수","domain":"수와 연산","level":1,"skill":"큰 수의 읽기","stem":"8,999,999보다 1 큰 수는 무엇인가요?","kind":"input","options":[],"answer":"9000000","explanation":"8,999,999에 1을 더하면 9,000,000입니다.","hint":"자리 올림을 차례대로 확인하세요.","misconception":"자리 올림 실수","role":"diagnostic"},{"id":"M4-U01-03","grade":4,"term":"4-1","unit_id":"U01","unit":"큰 수","domain":"수와 연산","level":2,"skill":"큰 수 비교","stem":"32,089,999와 32,090,001 중 더 큰 수를 고르세요.","kind":"choice","options":["32,089,999","32,090,001","같다","비교할 수 없다"],"answer":"32,090,001","explanation":"앞에서부터 비교하면 3,209만 1이 3,208만 9,999보다 큽니다. 두 수의 차이는 2입니다.","hint":"세 자리씩 끊어 비교해 보세요.","misconception":"자리수 비교 오류","role":"practice"},{"id":"M4-U01-04","grade":4,"term":"4-1","unit_id":"U01","unit":"큰 수","domain":"수와 연산","level":2,"skill":"큰 수 반올림","stem":"2,648,000을 만의 자리까지 반올림하면?","kind":"choice","options":["2,600,000","2,640,000","2,650,000","2,700,000"],"answer":"2,650,000","explanation":"만의 자리 오른쪽 천의 자리는 8이므로 만의 자리를 올려 2,650,000입니다.","hint":"반올림할 자리의 바로 오른쪽 숫자를 보세요.","misconception":"반올림 자리 혼동","role":"practice"},{"id":"M4-U02-01","grade":4,"term":"4-1","unit_id":"U02","unit":"각도","domain":"도형과 측정","level":1,"skill":"각도","stem":"삼각형의 두 각이 47°, 68°일 때 나머지 각은 몇 도인가요? (숫자만 입력)","kind":"input","options":[],"answer":"65","explanation":"삼각형 세 각의 합은 180°입니다. 180−47−68=65°입니다.","hint":"세 내각을 모두 더하면 일정한 각도가 돼요.","misconception":"각의 합 개념/뺄셈 오류","role":"diagnostic"},{"id":"M4-U02-02","grade":4,"term":"4-1","unit_id":"U02","unit":"각도","domain":"도형과 측정","level":1,"skill":"직각과 각도","stem":"직각에서 35°를 뺀 각의 크기는 몇 도인가요?","kind":"input","options":[],"answer":"55","explanation":"직각은 90°이므로 90−35=55°입니다.","hint":"직각의 크기를 떠올려 보세요.","misconception":"직각 크기 혼동","role":"diagnostic"},{"id":"M4-U02-03","grade":4,"term":"4-1","unit_id":"U02","unit":"각도","domain":"도형과 측정","level":2,"skill":"각도","stem":"일직선 위에 나란히 있는 두 각 중 하나가 130°라면 다른 하나는?","kind":"choice","options":["40","50","60","130"],"answer":"50","explanation":"일직선 위 두 각의 합은 180°이므로 50°입니다.","hint":"두 각을 합치면 평각이 됩니다.","misconception":"계산 또는 문제 읽기 오류","role":"practice"},{"id":"M4-U02-04","grade":4,"term":"4-1","unit_id":"U02","unit":"각도","domain":"도형과 측정","level":3,"skill":"각도","stem":"한 점 둘레에서 90°, 120°, 65°를 제외한 남은 각은?","kind":"input","options":[],"answer":"85","explanation":"한 점 둘레는 360°. 360−(90+120+65)=85°입니다.","hint":"한 바퀴의 각도에서 이미 주어진 각을 빼세요.","misconception":"덧셈 또는 뺄셈 과정 오류","role":"practice"},{"id":"M4-U03-01","grade":4,"term":"4-1","unit_id":"U03","unit":"곱셈과 나눗셈","domain":"수와 연산","level":1,"skill":"곱셈과 나눗셈","stem":"208 × 34 = ?","kind":"input","options":[],"answer":"7072","explanation":"208×30=6,240, 208×4=832. 합은 7,072입니다.","hint":"34를 30과 4로 나누어 곱해 보세요.","misconception":"곱셈 자리수 실수","role":"diagnostic"},{"id":"M4-U03-02","grade":4,"term":"4-1","unit_id":"U03","unit":"곱셈과 나눗셈","domain":"수와 연산","level":1,"skill":"곱셈과 나눗셈","stem":"936 ÷ 24 = ?","kind":"input","options":[],"answer":"39","explanation":"24×39=936이므로 몫은 39입니다.","hint":"24×40을 생각한 뒤 조절해 보세요.","misconception":"몫 추정/곱셈 실수","role":"diagnostic"},{"id":"M4-U03-03","grade":4,"term":"4-1","unit_id":"U03","unit":"곱셈과 나눗셈","domain":"수와 연산","level":2,"skill":"문장제 곱셈","stem":"28명인 반이 3개 있습니다. 학생 한 명마다 종이 6장씩 주려면 몇 장이 필요할까요?","kind":"input","options":[],"answer":"504","explanation":"28×3×6=504장입니다.","hint":"전체 학생 수부터 구해 보세요.","misconception":"문제 해석 오류","role":"practice"},{"id":"M4-U03-04","grade":4,"term":"4-1","unit_id":"U03","unit":"곱셈과 나눗셈","domain":"수와 연산","level":2,"skill":"곱셈과 나눗셈","stem":"1008 ÷ 16 = ?","kind":"input","options":[],"answer":"63","explanation":"16×63=1,008이므로 몫은 63입니다.","hint":"16×60=960을 이용하세요.","misconception":"계산 또는 문제 읽기 오류","role":"practice"},{"id":"M4-U04-01","grade":4,"term":"4-1","unit_id":"U04","unit":"평면도형의 이동","domain":"도형과 측정","level":1,"skill":"도형의 회전","stem":"위쪽 화살표 ↑를 시계 방향으로 90° 돌리면 어느 방향인가요?","kind":"choice","options":["←","→","↑","↓"],"answer":"→","explanation":"위를 향한 화살표는 시계 방향으로 90° 돌리면 오른쪽을 향합니다.","hint":"시계 바늘이 12에서 3으로 향하는 방향이에요.","misconception":"회전 방향 혼동","role":"diagnostic"},{"id":"M4-U04-02","grade":4,"term":"4-1","unit_id":"U04","unit":"평면도형의 이동","domain":"도형과 측정","level":1,"skill":"도형의 뒤집기","stem":"왼쪽 화살표 ←를 세로 거울(세로 대칭축)에 비춘 모습은?","kind":"choice","options":["←","→","↑","↓"],"answer":"→","explanation":"세로 거울에 비추면 좌우가 뒤집히므로 오른쪽 화살표가 됩니다.","hint":"거울은 좌우 방향을 바꾸어요.","misconception":"뒤집기와 돌리기 혼동","role":"diagnostic"},{"id":"M4-U04-03","grade":4,"term":"4-1","unit_id":"U04","unit":"평면도형의 이동","domain":"도형과 측정","level":2,"skill":"평행이동","stem":"점 (2, 3)을 오른쪽으로 4칸 평행이동하면 좌표는?","kind":"choice","options":["(2, 7)","(6, 3)","(-2, 3)","(2, -1)"],"answer":"(6, 3)","explanation":"오른쪽 이동은 가로 위치만 4 증가하므로 (6,3)입니다.","hint":"세로 위치는 바뀌지 않아요.","misconception":"가로 세로 혼동","role":"practice"},{"id":"M4-U04-04","grade":4,"term":"4-1 "변화와 관계","level":1,"skill":"배수 규칙","stem":"3, 6, 12, 24, □에서 □은?","kind":"input","options":[],"answer":"48","explanation":"앞의 수를 2배씩 하므로 24×2=48입니다.","hint":"차이뿐 아니라 배수 관계도 살펴보세요.","misconception":"계산 또는 문제 읽기 오류","role":"diagnostic"},{"id":"M4-U06-03","grade":4,"term":"4-1","unit_id":"U06","unit":"규칙 찾기","domain":"변화와 관계","level":3,"skill":"n번째 항","stem":"1번째=2, 2번째=5, 3번째=8인 규칙에서 10번째 수는?","kind":"input","options":[],"answer":"29","explanation":"3씩 커집니다. 10번째는 2+3×9=29입니다.","hint":"1번째에서 10번째까지 몇 번 늘어나는지 세세요.","misconception":"횟수 오프바이원","role":"practice"},{"id":"M4-U06-04","grade":4,"term":"4-1","unit_id":"U06","unit":"규칙 찾기","domain":"변화와 관계","level":3,"skill":"도형 규칙","stem":"성냥개비로 정사각형을 옆으로 이어 만들었습니다. 1개는 4개, 2개는 7개, 3개는 10개가 필요합니다. 8개를 만들면 성냥개비 몇 개가 필요할까요?","kind":"input","options":[],"answer":"25","explanation":"첫 개는 4개, 이후 정사각형 1개마다 3개씩 추가됩니다. 4+3×7=25개입니다.","hint":"처음 4개에서 새로운 정사각형 하나마다 몇 개가 늘까요?","misconception":"반복 증가량/횟수 오류","role":"practice"},{"id":"M4-U07-01","grade":4,"term":"4-2","unit_id":"U07","unit":"분수의 덧셈과 뺄셈","domain":"수와 연산","level":1,"skill":"동분모 분수 덧셈","stem":"3/7 + 2/7 = ? (예: 5/7)","kind":"input","options":[],"answer":"5/7","explanation":"분모가 같으므로 분자를 더하면 5/7입니다.","hint":"같은 크기로 나눈 조각끼리 계산해요.","misconception":"분모까지 더하는 오류","role":"diagnostic"},{"id":"M4-U07-02","grade":4,"term":"4-2","unit_id":"U07","unit":"분수의 덧셈과 뺄셈","domain":"수와 연산","level":1,"skill":"대분수 뺄셈","stem":"1과 1/5에서 3/5를 빼면? (예: 3/5)","kind":"input","options":[],"answer":"3/5","explanation":"1과 1/5=6/5이므로 6/5−3/5=3/5입니다.","hint":"1을 5/5로 나타내 보세요.","misconception":"받아내림 오류","role":"diagnostic"},{"id":"M4-U07-03","grade":4,"term":"4-2","unit_id":"U07","unit":"분수의 덧셈과 뺄셈","domain":"수와 연산","level":2,"skill":"대분수 덧셈","stem":"2와 3/8 + 1과 2/8 = ?","kind":"choice","options":["3과 1/8","3과 5/8","4과 5/8","3과 5/16"],"answer":"3과 5/8","explanation":"자연수끼리 더해 3, 분수끼리 더해 5/8이므로 3과 5/8입니다.","hint":"자연수 부분과 분수 부분을 나누어 계산하세요.","misconception":"분모 연산 오류","role":"practice"},{"id":"M4-U07-04","grade":4,"term":"4-2","unit_id":"U07","unit":"분수의 덧셈과 뺄셈","domain":"수와 연산","level":3,"skill":"자연수-대분수","stem":"3 − 1과 4/5 = ?","kind":"choice","options":["1과 1/5","2과 1/5","1과 4/5","2과 4/5"],"answer":"1과 1/5","explanation":"3=2와 5/5로 바꾸고 1과 4/5를 빼면 1과 1/5입니다.","hint":"자연수 하나를 5/5로 바꿀 수 있어요.","misconception":"받아내림 개념 오류","role":"practice"},{"id":"M4-U08-01","grade":4,"term":"4-2","unit_id":"U08","unit":"삼각형","domain":"도형과 측정","level":1,"skill":"삼각형 분류","stem":"세 변의 길이가 5cm, 5cm, 8cm인 삼각형은 어떤 삼각형인가요?","kind":"choice","options":["정삼각형","이등변삼각형","직각삼각형","삼각형이 아님"],"answer":"이등변삼각형","explanation":"두 변의 길이가 같으므로 이등변삼각형입니다. 5+5>8이어서 삼각형도 만들 수 있습니다.","hint":"같은 길이의 변이 몇 개인지 살펴보세요.","misconception":"삼각형 특성 혼동","role":"diagnostic"},{"id":"M4-U08-02","grade":4,"term":"4-2","unit_id":"U08","unit":"삼각형","domain":"도형과 측정","level":1,"skill":"삼각형 각도","stem":"세 각이 65°, 65°, □인 삼각형에서 □은 몇 도인가요?","kind":"input","options":[],"answer":"50","explanation":"180−65−65=50°입니다.","hint":"삼각형 세 내각의 합을 떠올리세요.","misconception":"각의 합 계산 오류","role":"diagnostic"},{"id":"M4-U08-03","grade":4,"term":"4-2","unit_id":"U08","unit":"삼각형","domain":"도형과 측정","level":2,"skill":"삼각형","stem":"직각삼각형의 한 예각이 32°라면 다른 예각은?","kind":"choice","options":["48","58","68","148"],"answer":"58","explanation":"직각 이외의 두 각은 90°를 이루므로 90−32=58°입니다.","hint":"이미 한 각이 90°라는 점을 이용하세요.","misconception":"계산 또는 문제 읽기 오류","role":"practice"},{"id":"M4-U08-04","grade":4,"term":"4-2","unit_id":"U08","unit":"삼각형","domain":"도형과 측정","level":3,"skill":"삼각형 성립 조건","stem":"다음 중 길이만으로 삼각형을 만들 수 없는 변의 조합은?","kind":"choice","options":["3cm, 4cm, 6cm","5cm, 5cm, 9cm","3cm, 4cm, 8cm","6cm, 7cm, 10cm"],"answer":"3cm, 4cm, 8cm","explanation":"삼각형은 짧은 두 변의 합이 가장 긴 변보다 커야 합니다. 3+4=7로 8보다 작습니다.","hint":"가장 긴 변이 나머지 두 변의 합보다 작아야 해요.","misconception":"조건 비교 오류","role":"practice"},{"id":"M4-U09-01","grade":4,"term":"4-2","unit_id":"U09","unit":"소수의 덧셈과 뺄셈","domain":"수와 연산","level":1,"skill":"소수 덧셈","stem":"3.7 + 2.85 = ?","kind":"input","options":[],"answer":"6.55","explanation":"3.70+2.85=6.55입니다.","hint":"소수점을 같은 줄에 맞춰 계산해 보세요.","misconception":"소수점 정렬 오류","role":"diagnostic"},{"id":"M4-U09-02","grade":4,"term":"4-2","unit_id":"U09","unit":"소수의 덧셈과 뺄셈","domain":"수와 연산","level":1,"skill":"소수 뺄셈","stem":"10 − 3.48 = ?","kind":"input","options":[],"answer":"6.52","explanation":"10.00−3.48=6.52입니다.","hint":"10을 10.00으로 바꾸어 자릿수를 맞추세요.","misconception":"받아내림/소수점 실수","role":"diagnostic"},{"id":"M4-U09-03","grade":4,"term":"4-2","unit_id":"U09","unit":"소수의 덧셈과 뺄셈","domain":"수와 연산","level":2,"skill":"소수의 덧셈과 뺄셈","stem":"0.06 + 0.7 = ?","kind":"choice","options":["0.13","0.67","0.76","1.30"],"answer":"0.76","explanation":"0.06+0.70=0.76입니다.","hint":"0.7을 0.70으로 써 보세요.","misconception":"계산 또는 문제 읽기 오류","role":"practice"},{"id":"M4-U09-04","grade":4,"term":"4-2","unit_id":"U09","unit":"소수의 덧셈과 뺄셈","domain":"수와 연산","level":3,"skill":"소수의 덧셈과 뺄셈","stem":"12.3 − 4.85 = ?","kind":"input","options":[],"answer":"7.45","explanation":"12.30−4.85=7.45입니다.","hint":"소수점과 자릿수를 맞춰 쓰세요.","misconception":"계산 또는 문제 읽기 오류","role":"practice"},{"id":"M4-U10-01","grade":4,"term":"4-2","unit_id":"U10","unit":"사각형","domain":"도형과 측정","level":1,"skill":"직사각형 둘레","stem":"가로 8cm, 세로 5cm인 직사각형의 둘레는 몇 cm인가요?","kind":"input","options":[],"answer":"26","explanation":"둘레는 (8+5)×2=26cm입니다.","hint":"네 변을 한 바퀴 더해 보세요.","misconception":"둘레 넓이 혼동","role":"diagnostic"},{"id":"M4-U10-02","grade":4,"term":"4-2","unit_id":"U10","unit":"사각형","domain":"도형과 측정","level":1,"skill":"평행사변형","stem":"평행사변형에서 한 내각이 125°라면 그 맞은편 내각은?","kind":"input","options":[],"answer":"125","explanation":"평행사변형의 마주 보는 각은 크기가 같으므로 125°입니다.","hint":"평행사변형의 마주 보는 각의 성질을 생각하세요.","misconception":"이웃각과 맞은편각 혼동","role":"diagnostic"},{"id":"M4-U10-03","grade":4,"term":"4-2","unit_id":"U10","unit":"사각형","domain":"도형과 측정","level":2,"skill":"사각형의 성질","stem":"다음 중 네 변의 길이가 모두 같고 네 각도 모두 직각인 도형은?","kind":"choice","options":["직사각형","평행사변형","정사각형","사다리꼴"],"answer":"정사각형","explanation":"두 조건을 모두 만족하는 도형은 정사각형입니다.","hint":"변과 각 조건을 모두 확인하세요.","misconception":"계산 또는 문제 읽기 오류","role":"practice"},{"id":"M4-U10-04","grade":4,"term":"4-2","unit_id":"U10","unit":"사각형","domain":"도형과 측정","level":2,"skill":"마름모 둘레","stem":"마름모의 한 변이 6cm일 때 둘레는 몇 cm인가요?","kind":"input","options":[],"answer":"24","explanation":"마름모는 네 변의 길이가 같으므로 6×4=24cm입니다.","hint":"마름모의 네 변에 관한 성질을 활용하세요.","misconception":"계산 또는 문제 읽기 오류","role":"practice"},{"id":"M4-U11-01","grade":4,"term":"4-2","unit_id":"U11","unit":"꺾은선그래프","domain":"자료와 가능성","level":1,"skill":"꺾은선그래프 변화","stem":"기온이 월 12°, 화 17°, 수 13°, 목 21°입니다. 전날보다 기온이 가장 많이 오른 요일은?","kind":"choice","options":["월요일","화요일","수요일","목요일"],"answer":"목요일","explanation":"화요일은 5° 상승, 목요일은 8° 상승으로 목요일이 가장 큽니다.","hint":"연속된 이틀 사이의 변화를 각각 계산하세요.","misconception":"최댓값과 상승폭 혼동","role":"diagnostic"},{"id":"M4-U11-02","grade":4,"term":"4-2","unit_id":"U11","unit":"꺾은선그래프","domain":"자료와 가능성","level":1,"skill":"전체 변화량","stem":"기온이 월 18°, 화 23°, 수 21°, 목 26°일 때 월요일에서 목요일까지 총 몇 도 올랐나요?","kind":"input","options":[],"answer":"8","explanation":"목요일 26°−월요일 18°=8° 상승입니다.","hint":"처음과 마지막 값을 비교하세요.","misconception":"변화량 합산 오류","role":"diagnostic"},{"id":"M4-U11-03","grade":4,"term":"4-2","unit_id":"U11","unit":"꺾은선그래프","domain":"자료와 가능성","level":2,"skill":"꺾은선그래프","stem":"어떤 값이 차례대로 8, 14, 11, 19일 때 가장 큰 증가폭은?","kind":"input","options":[],"answer":"8","explanation":"증가폭은 8→14에서 6, 11→19에서 8입니다. 최댓값은 8입니다.","hint":"바로 앞의 값과 비교하세요.","misconception":"계산 또는 문제 읽기 오류","role":"practice"},{"id":"M4-U11-04","grade":4,"term":"4-2","unit_id":"U11","unit":"꺾은선그래프","domain":"자료와 가능성","level":2,"skill":"꺾은선그래프","stem":"온도가 10°, 15°, 13°, 20°로 바뀌었습니다. 마지막 변화량은?","kind":"choice","options":["5","-2","7","10"],"answer":"7","explanation":"13°에서 20°로 바뀌었으므로 7° 상승입니다.","hint":"마지막 두 값의 차이를 구하세요.","misconception":"계산 또는 문제 읽기 오류","role":"practice"},{"id":"M4-U12-01","grade":4,"term":"4-2","unit_id":"U12","unit":"다각형","domain":"도형과 측정","level":1,"skill":"대각선","stem":"오각형의 대각선은 모두 몇 개인가요?","kind":"input","options":[],"answer":"5","explanation":"각 꼭짓점에서 자기 자신과 양옆을 제외한 2개와 연결하여 5×2÷2=5개입니다.","hint":"꼭짓점에서 양옆 이웃을 제외하고 연결해 보세요.","misconception":"중복 세기","role":"diagnostic"},{"id":"M4-U12-02","grade":4,"term":"4-2","unit_id":"U12","unit":"다각형","domain":"도형과 측정","level":1,"skill":"다각형 분류","stem":"팔각형에는 변이 몇 개인가요?","kind":"input","options":[],"answer":"8","explanation":"팔각형은 8개의 변과 꼭짓점을 가집니다.","hint":"도형 이름의 수를 떠올리세요.","misconception":"계산 또는 문제 읽기 오류","role":"diagnostic"},{"id":"M4-U12-03","grade":4,"term":"4-2","unit_id":"U12","unit":"다각형","domain":"도형과 측정","level":3,"skill":"정다각형 내각","stem":"정육각형의 한 내각은 몇 도인가요?","kind":"choice","options":["90","108","120","135"],"answer":"120","explanation":"정육각형 내각의 합은 (6−2)×180=720°. 한 각은 720÷6=120°입니다.","hint":"한 점에서 삼각형으로 나누어 생각해 보세요.","misconception":"삼각형 분할 오류","role":"practice"},{"id":"M4-U12-04","grade":4,"term":"4-2","unit_id":"U12","unit":"다각형","domain":"도형과 측정","level":2,"skill":"다각형","stem":"꼭짓점이 9개인 다각형의 변은 몇 개인가요?","kind":"input","options":[],"answer":"9","explanation":"다각형의 꼭짓점 수와 변의 수는 같습니다. 따라서 9개입니다.","hint":"꼭짓점과 변을 한 바퀴 순서대로 짝지어 보세요.","misconception":"계산 또는 문제 읽기 오류","role":"practice"},{"id":"C4-01","grade":4,"term":"도전","unit_id":"CH","unit":"경시형 사고력","domain":"조합과 최적화","level":7,"skill":"조합과 최적화","stem":"숫자 1, 2, 3, 4를 한 번씩 사용해 두 자리 수 두 개를 만듭니다. 두 수의 차이를 가장 크게 하면 그 차이는?","kind":"input","options":[],"answer":"31","explanation":"큰 수는 43, 작은 수는 12로 만들면 차이 31이 최대입니다.","hint":"십의 자리에 큰 숫자와 작은 숫자를 나누어 놓으세요.","misconception":"전략/조건 추론 오류","role":"challenge"},{"id":"C4-02","grade":4,"term":"도전","unit_id":"CH","unit":"경시형 사고력","domain":"최적화","level":8,"skill":"최적화","stem":"둘레가 44cm인 직사각형의 가로와 세로 길이가 자연수(cm)이고 정사각형도 허용할 때, 가능한 넓이 중 가장 큰 값은?","kind":"input","options":[],"answer":"121","explanation":"가로+세로=22이고 가장 비슷할 때 넓이가 최대입니다. 11×11=121㎠입니다.","hint":"합이 일정한 두 수의 곱은 두 수가 가까울수록 커집니다.","misconception":"전략/조건 추론 오류","role":"challenge"},{"id":"C4-03","grade":4,"term":"도전","unit_id":"CH","unit":"경시형 사고력","domain":"논리적 사고","level":8,"skill":"논리적 사고","stem":"구슬 13개를 상자 3개에 모두 넣었습니다. 반드시 적어도 한 상자에는 몇 개 이상의 구슬이 있을까요?","kind":"input","options":[],"answer":"5","explanation":"모든 상자에 최대 4개만 있다면 12개밖에 담지 못합니다. 따라서 하나에는 적어도 5개입니다.","hint":"모든 상자에 4개씩만 넣는 상황부터 생각하세요.","misconception":"전략/조건 추론 오류","role":"challenge"},{"id":"C4-04","grade":4,"term":"도전","unit_id":"CH","unit":"경시형 사고력","domain":"수의 성질","level":7,"skill":"수의 성질","stem":"연속하는 자연수 4개의 합이 90입니다. 가장 큰 수는?","kind":"input","options":[],"answer":"24","explanation":"21+22+23+24=90이므로 가장 큰 수는 24입니다.","hint":"네 수의 평균은 22.5이며 가운데 두 수 사이에 있어요.","misconception":"전략/조건 추론 오류","role":"challenge"},{"id":"C4-05","grade":4,"term":"도전","unit_id":"CH","unit":"경시형 사고력","domain":"조건 추론","level":7,"skill":"조건 추론","stem":"1, 2, 3, 5를 한 번씩 사용해 만든 네 자리 수 중 5의 배수이면서 가장 큰 수는?","kind":"input","options":[],"answer":"3215","explanation":"5의 배수이려면 끝자리가 5이어야 하고, 나머지를 큰 순서인 3,2,1로 배치해 3215가 됩니다.","hint":"5의 배수의 일의 자리 조건을 먼저 확인하세요.","misconception":"전략/조건 추론 오류","role":"challenge"},{"id":"C4-06","grade":4,"term":"도전","unit_id":"CH","unit":"경시형 사고력","domain":"규칙 일반화","level":7,"skill":"규칙 일반화","stem":"정사각형을 성냥개비로 가로 한 줄에 이어 만듭니다. 1개에 4개, 2개에 7개가 필요할 때, 정사각형 10개에 필요한 성냥개비 수는?","kind":"input","options":[],"answer":"31","explanation":"첫 정사각형은 4개, 이후 9개를 늘리면서 각 3개씩 추가하므로 4+27=31개입니다.","hint":"서로 붙어 있는 변은 공유하므로 4개씩 늘지 않아요.","misconception":"전략/조건 추론 오류","role":"challenge"},{"id":"C4-07","grade":4,"term":"도전","unit_id":"CH","unit":"경시형 사고력","domain":"집합적 사고","level":9,"skill":"집합적 사고","stem":"1부터 100까지의 자연수 중 3의 배수 또는 5의 배수는 모두 몇 개인가요?","kind":"input","options":[],"answer":"47","explanation":"3의 배수 33개 + 5의 배수 20개 − 두 번 센 15의 배수 6개 = 47개입니다.","hint":"3과 5의 공배수는 중복해서 세었을 수 있어요.","misconception":"전략/조건 추론 오류","role":"challenge"},{"id":"C4-08","grade":4,"term":"도전","unit_id":"CH","unit":"경시형 사고력","domain":"패턴과 합","level":8,"skill":"패턴과 합","stem":"첫째 줄에 1개, 둘째 줄에 2개, …, 스무 번째 줄에 20개 돌을 놓으면 총 몇 개인가요?","kind":"input","options":[],"answer":"210","explanation":"1+20=21인 쌍 10개를 만들 수 있으므로 21×10=210개입니다.","hint":"맨 앞과 맨 뒤의 수를 짝지어 보세요.","misconception":"전략/조건 추론 오류","role":"challenge"},{"id":"C4-09","grade":4,"term":"도전","unit_id":"CH","unit":"경시형 사고력","domain":"경우의 수","level":9,"skill":"경우의 수","stem":"격자에서 오른쪽으로 2칸, 위쪽으로 2칸만 이동하여 (0,0)에서 (2,2)로 가는 가장 짧은 경로는 몇 가지인가요?","kind":"input","options":[],"answer":"6","explanation":"총 4번 이동 중 오른쪽 이동 2번의 위치를 고르는 경우는 6가지입니다.","hint":"오른쪽 2번과 위쪽 2번을 어떤 순서로 배열할지 생각하세요.","misconception":"전략/조건 추론 오류","role":"challenge"},{"id":"C4-10","grade":4,"term":"도전","unit_id":"CH","unit":"경시형 사고력","domain":"경우의 수","level":8,"skill":"경우의 수","stem":"서로 다른 5팀이 다른 모든 팀과 정확히 한 번씩 경기를 하면 총 몇 경기를 하나요?","kind":"input","options":[],"answer":"10","explanation":"각 팀마다 4팀과 경기하므로 5×4=20이지만 경기가 두 번씩 세어져 2로 나누면 10입니다.","hint":"A팀과 B팀의 경기를 A 기준과 B 기준에서 중복 세지 않도록 하세요.","misconception":"전략/조건 추론 오류","role":"challenge"}]};const QUESTIONS=DB.questions;const DIAG=QUESTIONS.filter(q=>q.role==='diagnostic');const PRACTICE=QUESTIONS.filter(q=>q.role==='practice');const CHALLENGE=QUESTIONS.filter(q=>q.role==='challenge');const byId=Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));const STORE='hajun_math_explorer_2026_v1';
let state=load(),page='home',selected='',confidence='sure',hintUsed=false,submitted=false,qStarted=Date.now();function load(){try{let s=JSON.parse(localStorage.getItem(STORE));return s&&Array.isArray(s.sessions)?s:{sessions:[],active:null,xp:0}}catch(e){return {sessions:[],active:null,xp:0}}}function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){console.warn('저장 실패',e)}}function esc(t){return String(t??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}function fmt(n){return Number(n||0).toLocaleString('ko-KR')}function dt(s){return new Date(s).toLocaleDateString('ko-KR',{year:'numeric',month:'numeric',day:'numeric'})}function randomize(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function normalize(x){return String(x||'').normalize('NFKC').replace(/[,\s]/g,'').replace(/[−–]/g,'-').replace(/\.$/,'').toLowerCase()}function equal(a,b){if(normalize(a)===normalize(b))return true;let aa=Number(normalize(a)),bb=Number(normalize(b));return normalize(a)!==''&&normalize(b)!==''&&Number.isFinite(aa)&&Number.isFinite(bb)&&Math.abs(aa-bb)<1e-9}
function latestDiag(){return [...state.sessions].reverse().find(s=>s.mode==='diagnostic')}function navActive(which){document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.page===which))}function setPage(p){page=p;state.active=null;save();render()}function render(){document.getElementById('starpill').textContent='⭐ '+fmt(state.xp)+' XP';navActive(['home','report','units','parent'].includes(page)?page:'home');const main=document.getElementById('content');if(page==='home')main.innerHTML=home();else if(page==='report')main.innerHTML=report();else if(page==='units')main.innerHTML=unitsPage();else if(page==='parent')main.innerHTML=parent();else if(page==='quiz')main.innerHTML=quiz();else if(page==='finish')main.innerHTML=finish();}
function home(){let l=latestDiag(),att=state.sessions.flatMap(s=>s.responses),got=att.filter(r=>r.correct).length;return `<section class="hero"><div class="eyebrow">MATH EXPLORER · LEVEL UP</div><h1>하준아, 오늘은 어떤<br>수학 모험을 떠나볼까?</h1><p>정답뿐 아니라 생각하는 과정이 중요해. 기초는 단단하게, 어려운 문제는 신나게 도전하자!</p><button class="primary" onclick="start('diagnostic')">${l?'실력 다시 진단하기':'나의 수학 실력 진단 시작'} →</button></section><div class="statgrid"><div class="stat"><strong>${state.sessions.length}</strong><span>완료한 미션</span></div><div class="stat"><strong>${att.length}</strong><span>푼 문제</span></div><div class="stat"><strong>${got}</strong><span>맞힌 문제</span></div><div class="stat"><strong>${fmt(state.xp)}</strong><span>경험치 XP</span></div></div><div class="section-head"><h2>🚀 오늘의 미션</h2><small>천천히, 정확하게!</small></div><div class="grid3"><article class="mode-card"><div class="emoji">🧭</div><h3>수학 실력 진단</h3><p>초4 12개 영역 × 2문제. 24문항으로 강점과 보완 영역을 찾아요. 약 20~30분.</p><span class="tag blue">첫 진단 추천</span><button class="secondary" onclick="start('diagnostic')">진단 시작하기</button></article><article class="mode-card"><div class="emoji">🎯</div><h3>오답·개념 연습</h3><p>약한 영역과 아직 풀지 않은 문제를 섞어서 10문제씩 도전해요. 힌트와 해설이 있어요.</p><span class="tag">문제 정확도 훈련</span><button class="secondary" onclick="start('practice')">10문제 풀기</button></article><article class="mode-card"><div class="emoji">🏆</div><h3>경시형 챌린지</h3><p>조합, 논리, 규칙, 최적화 문제에 도전! 실제 기출 복제가 아닌 자체 제작 문제예요.</p><span class="tag gold">어려워도 즐겁게</span><button class="secondary" onclick="start('challenge')">도전 5문제</button></article></div><div class="section-head"><h2>📚 학습 진도 미리보기</h2><small>4학년 1·2학기</small></div><div class="unitgrid">${DB.units.map(u=>`<div class="unit"><small>${u.term} · ${esc(u.domain)}</small><b>${esc(u.unit)}</b></div>`).join('')}</div><p class="notice" style="margin-top:18px">첫 진단은 도움 없이 풀고, 연필과 연습장을 사용할 수 있습니다. 진단 중에는 정답을 알려주지 않아요. 문제를 푸는 속도보다 자신이 아는 방법으로 정확히 푸는 것이 중요합니다.</p>`}
function start(mode,unitId){let qs;if(mode==='diagnostic'){qs=DIAG.map(x=>x.id)}else if(mode==='challenge'){let seen=new Set(state.sessions.filter(x=>x.mode==='challenge').flatMap(x=>x.responses.filter(r=>r.correct).map(r=>r.qid)));qs=randomize(CHALLENGE).sort((a,b)=>Number(seen.has(a.id))-Number(seen.has(b.id))).slice(0,5).map(x=>x.id)}else if(mode==='review'){let recent=state.sessions.flatMap(s=>s.responses).filter(r=>!r.correct);let ids=[...new Set(recent.map(r=>r.qid))];qs=randomize(ids).slice(0,10);if(!qs.length){alert('복습할 오답이 아직 없어요. 일반 연습 미션을 시작해요.');return start('practice')}}else{let pool=unitId?QUESTIONS.filter(q=>q.unit_id===unitId&&q.role!=='challenge'):PRACTICE;let performed=state.sessions.flatMap(x=>x.responses);let wrongIds=new Set(performed.filter(r=>!r.correct).map(r=>r.qid));let seenIds=new Set(performed.map(r=>r.qid));let weight=q=>(wrongIds.has(q.id)?0:seenIds.has(q.id)?2:1);qs=randomize(pool).sort((a,b)=>weight(a)-weight(b)).slice(0,10).map(q=>q.id);if(!qs.length)return alert('선택한 단원에 문제가 없어요.')}
state.active={id:'s'+Date.now(),mode,questions:qs,index:0,responses:[],startedAt:new Date().toISOString(),unitId:unitId||null};save();page='quiz';resetQ();render();window.scrollTo({top:0,behavior:'smooth'})}
function resetQ(){selected='';confidence='sure';hintUsed=false;submitted=false;qStarted=Date.now()};function current(){return state.active&&byId[state.active.questions[state.active.index]]};function quiz(){let s=state.active;if(!s)return empty('진행 중인 미션이 없어요.');let q=current(),n=s.index+1,total=s.questions.length,diagnostic=s.mode==='diagnostic',challenge=s.mode==='challenge';let choices=q.options.length?`<div class="answers">${q.options.map((a,i)=>`<button class="answer" data-answer="${esc(a)}"><span class="key">${'ABCD'[i]}</span>${esc(a)}</button>`).join('')}</div>`:`<div class="answers"><input id="ans" class="ansinput" inputmode="decimal" placeholder="답을 입력하세요" aria-label="정답 입력" autocomplete="off"><small class="muted">분수는 3/5처럼 입력하고, 숫자에 쉼표는 생략해도 돼요.</small></div>`;return `<div class="question-shell"><div class="row between"><b>${diagnostic?'🧭 실력 진단':challenge?'🏆 경시형 챌린지':s.mode==='review'?'🔄 오답 다시풀기':'🎯 연습 미션'}</b><span class="tag">${n} / ${total}</span></div><div style="margin-top:12px" class="progress-track"><div class="progress-fill" style="width:${(n-1)/total*100}%"></div></div><article class="question"><div class="row"><span class="tag blue">${esc(q.term)} · ${esc(q.unit)}</span><span class="tag ${q.level>6?'gold':''}">난도 ${q.level}/10</span></div><h2>${esc(q.stem)}</h2>${choices}<div class="confbox"><div class="muted" style="margin-bottom:9px">이 답에 얼마나 자신 있나요? (실력 분석에 활용돼요)</div><label><input type="radio" name="confidence" value="sure" checked> 확실해요</label><label><input type="radio" name="confidence" value="unsure"> 조금 헷갈려요</label><label><input type="radio" name="confidence" value="guess"> 찍었어요</label></div><div id="qfeedback"></div><div class="qfooter"><div class="row">${diagnostic?'<span class="muted">진단 중에는 힌트가 제공되지 않아요.</span>':`<button class="miniBtn" id="hintbutton">💡 힌트 보기</button>`}</div><button class="primary" id="submitbutton" disabled>답 제출하기 →</button></div><div id="hintbox" class="hide insight"></div></article><p class="muted" style="text-align:center">${diagnostic?'점수보다 정확한 현재 실력을 확인하는 시간입니다.':'오답은 성장의 단서예요. 천천히 생각해 보세요.'}</p></div>`}
function enterSelection(v){if(submitted)return;selected=v;document.querySelectorAll('.answer').forEach(x=>x.classList.toggle('selected',x.dataset.answer===v));let b=document.getElementById('submitbutton');if(b)b.disabled=!String(v).trim()}
function submit(){let s=state.active,q=current();if(!s||submitted||!String(selected).trim())return;let conf=document.querySelector('input[name="confidence"]:checked');confidence=conf?conf.value:'sure';let r={qid:q.id,given:String(selected).trim(),correct:equal(selected,q.answer),seconds:Math.min(900,Math.max(1,Math.round((Date.now()-qStarted)/1000))),confidence,hintUsed,errorReason:'',at:new Date().toISOString()};s.responses.push(r);submitted=true;if(s.mode==='diagnostic'){advance();return}let f=document.getElementById('qfeedback');f.innerHTML=`<div class="feedback ${r.correct?'':'wrong'}"><b>${r.correct?'✅ 정확해요! +10 XP':'🌱 좋은 시도였어요. 다시 배우면 돼요!'}</b><p><strong>정답:</strong> ${esc(q.answer)}</p><p>${esc(q.explanation)}</p>${r.correct?'':`<div style="margin-top:13px"><label class="muted">틀린 이유를 스스로 골라봐요</label><br><select class="sel" id="reason"><option value="">원인 선택 (선택사항)</option><option>숫자를 잘못 보거나 적음</option><option>계산 과정 실수</option><option>개념을 잘 몰랐음</option><option>문제 조건을 잘못 읽음</option><option>해결 전략이 떠오르지 않음</option></select></div>`}</div>`;if(r.correct)state.xp+=10;save();let btn=document.getElementById('submitbutton');btn.textContent=s.index===s.questions.length-1?'결과 확인하기 →':'다음 문제 →';btn.disabled=false}
function advance(){let s=state.active;if(!s)return;let reason=document.getElementById('reason');if(reason&&s.responses.length)s.responses[s.responses.length-1].errorReason=reason.value;if(s.index+1<s.questions.length){s.index++;save();resetQ();render();let inp=document.getElementById('ans');if(inp)inp.focus();window.scrollTo({top:0,behavior:'smooth'})}else{let ended={...s,finishedAt:new Date().toISOString()};delete ended.index;state.sessions.push(ended);state.active=null;save();page='finish';window.finishedId=ended.id;render();window.scrollTo({top:0,behavior:'smooth'})}}
function lookupSession(){return state.sessions.find(s=>s.id===window.finishedId)||state.sessions[state.sessions.length-1]}function score(s){let num=s.responses.filter(r=>r.correct).length;return {num,total:s.responses.length,pct:s.responses.length?Math.round(num/s.responses.length*100):0}}
function finish(){let s=lookupSession();if(!s)return empty('완료한 미션이 없어요');let sc=score(s),xp=s.responses.filter(r=>r.correct).length*10;let wrong=s.responses.filter(r=>!r.correct);let uncertain=s.responses.filter(r=>r.confidence!=='sure');return `<div class="question-shell"><div class="panel" style="text-align:center"><div class="resultmark">${sc.pct>=90?'🏅':sc.pct>=60?'🌟':'🌱'}</div><p class="eyebrow">MISSION COMPLETE</p><h1>${s.mode==='diagnostic'?'4학년 수학 진단 완료':'오늘의 도전 완료!'}</h1><div class="bigscore">${sc.num} / ${sc.total}</div><p class="help">정답률 ${sc.pct}% · 총 풀이 시간 ${Math.ceil(s.responses.reduce((a,r)=>a+r.seconds,0)/60)}분 · ${s.mode==='diagnostic'?'진단 중 힌트 없음':'선택한 힌트 사용 횟수 '+s.responses.filter(r=>r.hintUsed).length}</p><div class="divider"></div><div class="row" style="justify-content:center"><span class="tag">⚠️ 오답 ${wrong.length}개</span><span class="tag">🤔 헷갈림·추측 ${uncertain.length}개</span><span class="tag gold">⭐ 정확도 성취</span></div><div class="inline-actions" style="justify-content:center;margin-top:22px"><button class="secondary" onclick="setPage('report')">영역별 결과 분석</button><button class="soft" onclick="start('review')">오답 다시 풀기</button><button class="soft" onclick="setPage('home')">홈으로</button></div></div>${s.mode==='diagnostic'?`<div class="panel" style="margin-top:18px"><h3>📌 12개 단원별 결과</h3><p class="help">각 단원은 단 2문항이므로 강약점을 확정할 수 없습니다. 추가 연습 결과와 함께 해석하세요.</p>${renderBars(s)}</div>`:''}<div class="panel" style="margin-top:18px"><h3>🔎 해설 및 오답 원인 기록</h3><p class="help">틀린 문제의 원인을 고르면 부모님 분석 화면에 반영됩니다.</p>${s.responses.map((r,i)=>reviewHTML(r,i,s.id)).join('')}</div></div>`}
function renderBars(s){let a=s.responses.map(r=>({...r,q:byId[r.qid]}));return DB.units.map(u=>{let z=a.filter(x=>x.q.unit_id===u.unit_id);if(!z.length)return '';let p=Math.round(z.filter(x=>x.correct).length/z.length*100),style=p===100?'':p===50?'mid':'low';return `<div class="barrow"><span>${esc(u.unit)}</span><div class="track"><div class="fill ${style}" style="width:${p}%"></div></div><b>${z.filter(x=>x.correct).length}/${z.length}</b></div>`}).join('')}
function reviewHTML(r,i,sid){let q=byId[r.qid],wrong=!r.correct;return `<div class="review-item"><div class="row between"><b>${i+1}. ${esc(q.unit)} <span class="status ${wrong?'no':'ok'}">${wrong?'오답':'정답'}</span></b><small class="micro">${r.seconds}초 · ${r.confidence==='sure'?'확신':r.confidence==='unsure'?'헷갈림':'추측'}</small></div><p>${esc(q.stem)}</p><p class="micro">내 답: <b>${esc(r.given)}</b> · 정답: <b>${esc(q.answer)}</b></p><p style="font-size:13px">${esc(q.explanation)}</p>${wrong?`<label class="micro">오답 원인 분류</label><br><select class="sel" data-reason-session="${esc(sid)}" data-reason-index="${i}"><option value="">원인 미확정</option>${['숫자를 잘못 보거나 적음','계산 과정 실수','개념을 잘 몰랐음','문제 조건을 잘못 읽음','해결 전략이 떠오르지 않음'].map(x=>`<option ${r.errorReason===x?'selected':''}>${x}</option>`).join('')}</select>`:''}</div>`}
function report(){let s=latestDiag();if(!s)return `<div class="empty panel"><div class="emoji">🧭</div><h2>먼저 진단평가를 시작해 주세요.</h2><p class="help">12개 단원 24문항으로 하준이의 현재 출발점을 살펴봅니다.</p><button class="primary" style="margin-top:16px" onclick="start('diagnostic')">진단평가 시작</button></div>`;let sc=score(s),wr=s.responses.filter(r=>!r.correct),care=wr.filter(r=>['숫자를 잘못 보거나 적음','계산 과정 실수'].includes(r.errorReason)),wrongReasons=wr.filter(r=>r.errorReason).length;let weak=DB.units.map(u=>({u,rs:s.responses.filter(r=>byId[r.qid].unit_id===u.unit_id)})).filter(x=>x.rs.length&&x.rs.some(r=>!r.correct)).sort((a,b)=>a.rs.filter(r=>r.correct).length-b.rs.filter(r=>r.correct).length);let uncertainCorrect=s.responses.filter(r=>r.correct&&r.confidence!=='sure');let hist=state.sessions.filter(x=>x.mode==='diagnostic').slice(-5);return `<div class="section-head"><h2>📊 하준이 수학 성장 리포트</h2><small>마지막 진단 ${dt(s.finishedAt)}</small></div><div class="statgrid"><div class="stat"><strong>${sc.pct}%</strong><span>최근 진단 정답률</span></div><div class="stat"><strong>${Math.round(s.responses.reduce((a,r)=>a+r.seconds,0)/s.responses.length)}초</strong><span>문항당 평균 시간</span></div><div class="stat"><strong>${wr.length}</strong><span>틀린 문제</span></div><div class="stat"><strong>${uncertainCorrect.length}</strong><span>맞혔지만 자신 없음</span></div></div><div class="grid2" style="margin-top:18px"><div class="panel"><h3>영역별 정확도</h3><p class="help">초4 12개 단원, 단원당 2문항</p>${renderBars(s)}</div><div class="panel"><h3>🩺 학습 분석</h3>${weak.length?`<p class="help">추가 확인이 필요한 영역</p>${weak.slice(0,5).map(x=>`<div class="insight"><b>${esc(x.u.unit)}</b><div class="micro">${x.rs.filter(r=>r.correct).length}/${x.rs.length}개 정답 · 아래 단원 연습에서 추가 확인</div></div>`).join('')}`:'<div class="callout">진단 범위에서는 모두 맞혔어요! 사고력과 심화 문제로 확장해 보세요.</div>'}<p class="help">${wrongReasons?`오답 ${wr.length}개 중 원인을 선택한 ${wrongReasons}개에서 계산·오기 관련 자기보고는 ${care.length}개입니다.`:'오답 원인을 기록하면 계산 실수인지 개념 이해 문제인지 구분하는 데 도움이 됩니다.'}</p><p class="notice">정답만으로 부주의와 개념 부족을 자동 판별할 수 없습니다. 스스로 고른 오답 원인과 다시 풀기 결과를 함께 보세요.</p></div></div><div class="grid2" style="margin-top:18px"><div class="panel"><h3>📈 반복 진단 추이</h3>${hist.map((x,i)=>`<div class="barrow"><span>${dt(x.finishedAt)}</span><div class="track"><div class="fill" style="width:${score(x).pct}%"></div></div><b>${score(x).pct}%</b></div>`).join('')}<p class="micro">같은 문제를 다시 풀면 기억 효과가 점수에 영향을 줄 수 있습니다.</p></div><div class="panel"><h3>🎯 다음 학습 추천</h3><p>${weak.length?`<b>${esc(weak[0].u.unit)}</b> 단원부터 10문제를 풀며 원인을 확인해 보세요.`:'기초 영역은 안정적으로 보입니다. 경시형 사고력을 도전해 보세요.'}</p><div class="inline-actions">${weak.length?`<button class="primary" onclick="start('practice','${weak[0].u.unit_id}')">취약 단원 연습</button>`:''}<button class="soft" onclick="start('challenge')">경시형 도전</button><button class="soft" onclick="start('review')">오답 다시풀기</button></div></div></div><div class="panel" style="margin-top:18px"><h3>최근 진단 답안 및 원인 분석</h3>${s.responses.map((r,i)=>reviewHTML(r,i,s.id)).join('')}</div>`}
function unitsPage(){let all=state.sessions.flatMap(s=>s.responses);return `<div class="section-head"><h2>📚 영역별 수학 학습</h2><small>4학년 1학기 · 2학기</small></div><p class="help" style="margin-bottom:20px">진단 결과를 참고하여 원하는 영역을 다시 공부해 보세요. 단원별 학습 문제는 2문제부터 시작하며, 전체 연습에는 여러 단원의 문제를 섞습니다.</p><div class="unitgrid">${DB.units.map((u,i)=>{let seen=all.filter(r=>byId[r.qid]?.unit_id===u.unit_id),ok=seen.filter(r=>r.correct).length;return `<article class="unit"><small>${u.term} · ${esc(u.domain)}</small><h3 style="margin:8px 0">${i+1}. ${esc(u.unit)}</h3><p class="micro">학습 기록 ${seen.length}회 · 정답 ${ok}회</p><button class="soft" onclick="start('practice','${u.unit_id}')">학습하기 →</button></article>`}).join('')}</div>`}
function parent(){let last=latestDiag();return `<div class="section-head"><h2>👨‍👩‍👦 부모님 대시보드</h2><small>학습 기록은 이 기기에만 저장됩니다.</small></div><div class="grid2"><div class="panel"><h3>데이터 관리</h3><p class="help">학습 기록을 JSON 파일로 내보내 ChatGPT에 업로드하면 보다 자세한 분석을 요청할 수 있어요. 기록에는 답안과 학습 시간 등이 포함됩니다.</p><div class="inline-actions" style="margin:19px 0"><button class="secondary" onclick="exportResults()">⬇️ 학습 기록 내보내기</button><button class="soft" onclick="document.getElementById('importFile').click()">⬆️ 기록 가져오기</button><input id="importFile" type="file" accept=".json,application/json" class="hide"></div><div class="divider"></div><button class="danger" onclick="clearAll()">이 기기의 기록 삭제</button></div><div class="panel"><h3>이렇게 활용해 주세요</h3><p>① 처음에는 도움 없이 24문항 진단<br>② 틀린 문제의 이유를 아이가 직접 선택<br>③ 취약 단원과 연산 9단계를 병행<br>④ 일주일에 경시형 문제 1~2개 도전<br>⑤ 2~4주 후 재평가</p><p class="notice">첫 진단은 작은 표본이므로 한 단원에서 1개 틀렸다는 이유만으로 결손을 단정하지 마세요. 문제은행 버전과 반복 응시 효과도 고려해야 합니다.</p></div></div><div class="panel" style="margin-top:18px"><h3>완료한 미션 기록</h3>${state.sessions.length?`<div class="table-wrap"><table><thead><tr><th>날짜</th><th>유형</th><th>점수</th><th>시간</th><th></th></tr></thead><tbody>${[...state.sessions].reverse().slice(0,30).map(s=>`<tr><td>${dt(s.finishedAt)}</td><td>${s.mode==='diagnostic'?'진단':s.mode==='challenge'?'경시 도전':s.mode==='review'?'오답 복습':'연습'}</td><td>${score(s).num}/${score(s).total}</td><td>${Math.ceil(s.responses.reduce((a,r)=>a+r.seconds,0)/60)}분</td><td><button class="miniBtn" onclick="showSession('${s.id}')">결과 보기</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="help">아직 완료한 미션이 없어요.</p>'}</div><div class="panel" style="margin-top:18px"><h3>개인정보와 사용 범위</h3><p class="help">로그인/서버/광고/외부 학습 데이터 전송 기능이 없습니다. 다만 학습 중인 브라우저의 로컬 저장소를 지우거나 기기를 바꾸면 기록이 사라질 수 있으므로 주기적으로 내보내기 해주세요. 공개 GitHub Pages에 올려도 문제와 정답 데이터는 누구나 열람할 수 있으며, 실제 상업 서비스에는 서버 측 채점과 계정·보안 설계가 추가로 필요합니다.</p></div>`}
function empty(msg){return `<div class="empty panel"><div class="emoji">📘</div><h2>${esc(msg)}</h2><button class="primary" onclick="setPage('home')">홈으로</button></div>`}
function exportResults(){let out={product:'하준이 수학 탐험',version:DB.version,exportedAt:new Date().toISOString(),sessions:state.sessions,xp:state.xp};let blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='하준이_수학학습기록_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function clearAll(){if(confirm('모든 학습 기록을 이 기기에서 삭제할까요? 이 작업은 되돌릴 수 없어요.')){state={sessions:[],active:null,xp:0};save();page='home';render()}}
function showSession(id){window.finishedId=id;page='finish';render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{let n=e.target.closest('.navbtn');if(n){setPage(n.dataset.page);return}let a=e.target.closest('[data-answer]');if(a){enterSelection(a.dataset.answer);return}if(e.target.closest('#submitbutton')){if(submitted)advance();else submit();return}if(e.target.closest('#hintbutton')){let q=current();let t=document.getElementById('hintbox');if(t){hintUsed=true;t.innerHTML='<b>💡 힌트</b> '+esc(q.hint);t.classList.remove('hide')}return}});
document.addEventListener('input',e=>{if(e.target.id==='ans')enterSelection(e.target.value)});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans'&&selected.trim()&&state.active){e.preventDefault();if(!submitted)submit();else advance()}});document.addEventListener('change',e=>{let el=e.target;if(el.matches('[data-reason-session]')){let s=state.sessions.find(s=>s.id===el.dataset.reasonSession);if(s&&s.responses[Number(el.dataset.reasonIndex)]){s.responses[Number(el.dataset.reasonIndex)].errorReason=el.value;save()}}if(el.id==='importFile'&&el.files[0]){let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!Array.isArray(x.sessions)||!x.sessions.every(s=>Array.isArray(s.responses)))throw Error('기록 형식 오류');if(!confirm('현재 학습 기록을 가져온 파일로 교체할까요?'))return;state={sessions:x.sessions,active:null,xp:Number(x.xp)||0};save();render();alert('가져왔습니다.')}catch(e){alert('올바른 기록 파일인지 확인해 주세요.')}};reader.readAsText(el.files[0])}});
window.start=start;window.setPage=setPage;window.exportResults=exportResults;window.clearAll=clearAll;window.showSession=showSession;document.getElementById('homeLogo').addEventListener('click',e=>{e.preventDefault();setPage('home')});
if(state.active&&state.active.questions?.length){page='quiz';resetQ()}render();
</script></body></html>
