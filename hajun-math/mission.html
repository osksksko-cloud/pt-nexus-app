<style>

*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55}
header{background:var(--blue);color:#fff;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

html,body{overflow-x:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
h1{font-size:24px;margin:0 0 6px}h2{font-size:20px;margin:0 0 10px}h3{font-size:17px;margin:0 0 8px}

.pop{animation:pop .35s ease}@keyframes pop{0%{transform:scale(.96)}100%{transform:scale(1)}}

.tbar{position:sticky;top:0;z-index:10;background:#1d2a44;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}

<body>
<header><b>🧭 수학 탐험 · 오늘의 미션</b><nav><button onclick="location.href='start.html'">시작화면</button><button onclick="go('home')">홈</button><button onclick="go('parent')">부모님</button></nav></header>
<div id="tbar" class="tbar" style="display:none"><div class="clock" id="tclock">0:00</div><div class="tp"><div class="track"><i id="tfill"></i></div><div class="lab" id="tlab"></div></div></div>
<main id="app"><div class="card">문제를 불러오는 중…</div></main>
<script src="mission_data.js"></script>
<script src="progress.js"></script>
<script src="notify.js"></script>
<script>
/* ---------------------------------------------------------------
   하준이 수학 탐험 · 오늘의 미션 (설계: 수학/학습설계 정책 v0.3)
   - 미션: 연산 → 개념 → 기본 → 응용 → 오답 확인(같은 유형 새 숫자) → 돌아보기
   - 경험치: 활동당 10XP, 하루 최대 50XP, 100XP마다 레벨 +1 (같은 날 같은 활동 중복 지급 없음)
   - 레벨은 '꾸준히 학습한 활동의 누적'이며 실력 등급이 아님. 개념 확인 상태는 따로 표시.
   - 기록은 이 기기 브라우저(localStorage)에만 저장됨.
---------------------------------------------------------------- */
const D = window.MISSION_DATA;
const STORE = 'hajun_math_mission_v1';
const XP_PER = 10, XP_DAY_MAX = 50, XP_LEVEL = 100, MAX_REPAIR_TRIES = 2;
const STEP_NAMES = {arith:'연산 준비', concept:'개념', basic:'기본', app:'응용', repair:'오답 확인', reflect:'돌아보기', done:'완료'};
const STEP_ORDER = ['arith','concept','basic','app','repair','reflect','done'];
const byId = {}; const byFam = {}; const byUnit = {};
D.questions.forEach(q => { byId[q.id] = q; (byFam[q.f] ||= []).push(q); (byUnit[q.u] ||= []).push(q); });
const unitById = Object.fromEntries(D.units.map(u => [u.id, u]));

/* ---------- 저장 ---------- */
function blank(){ return {grade:4, unitId:null, xpAwards:{}, seen:{}, attempts:[], wrong:[], days:{}, active:null, review:null, settings:{openAll:false, opened:{}}}; }
let S = load();
function load(){ try{ const s = JSON.parse(localStorage.getItem(STORE)); return s && typeof s === 'object' ? Object.assign(blank(), s, {xpAwards: s.xpAwards || {}}) : blank(); } /* 다른 화면(연산·레이스) 기록이 있으면 지우지 않고 이어 씀 */catch(e){ return blank(); } }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){ alert('기록 저장에 실패했어요. 브라우저 저장 공간을 확인해 주세요.'); } }

/* ---------- 날짜 ---------- */
function today(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateObj(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s){ const d = dateObj(s); return (d.getMonth()+1)+'/'+d.getDate()+'('+'일월화수목금토'[d.getDay()]+')'; }
function isSaturday(){ return new Date().getDay() === 6; }
function lastNDays(n){ const out=[]; const d=new Date(); for(let i=n-1;i>=0;i--){ const x=new Date(d); x.setDate(d.getDate()-i); out.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')); } return out; }

/* ---------- 경험치·레벨 ---------- */
function totalXP(){ return Object.values(S.xpAwards).reduce((a,b)=>a+b,0); }
function dayXP(date){ return Object.entries(S.xpAwards).filter(([k])=>k.startsWith(date+'|') && !k.endsWith('|drill')).reduce((a,[,v])=>a+v,0); }  // ⚡연산 훈련 XP는 한도와 별도
function level(){ const t = totalXP(); return {lv: 1 + Math.floor(t / XP_LEVEL), prog: t % XP_LEVEL, total: t}; }
function award(key){
  const date = today(), k = date+'|'+PROGRESS.xpKey(S, key);   // 내일 수업을 미리 하면 그 수업 몫의 경험치도 따로
  if (S.xpAwards[k]) return 0;                       // 같은 수업에서 같은 활동은 한 번만
  const room = PROGRESS.xpCap(S) - dayXP(date); if (room <= 0) return 0;
  const before = level().lv; S.xpAwards[k] = Math.min(XP_PER, room); save();
  const after = level().lv; if (after > before) S._levelUp = after;
  return S.xpAwards[k];
}

/* ---------- 정답 판정 (문제은행 answer_rules.py 와 같은 규칙) ---------- */
const UNIT_ALIASES = {'cm²':['cm²','cm2','㎠','제곱센티미터'],'m²':['m²','m2','㎡','제곱미터'],'cm³':['cm³','cm3','㎤','세제곱센티미터'],'m³':['m³','m3','㎥'],
  'L':['L','l','리터'],'mL':['mL','ml','밀리리터'],'°':['°','도'],'°C':['°C','℃','도'],'cm':['cm','㎝','센티미터'],'m':['m','미터'],'kg':['kg','킬로그램'],'g':['g','그램'],'%':['%','퍼센트']};
function gcd(a,b){ a=a<0n?-a:a; b=b<0n?-b:b; while(b){ [a,b]=[b,a%b]; } return a; }
function frac(n,d){ n=BigInt(n); d=BigInt(d); if(d===0n) throw 0; const g=gcd(n,d)||1n; return [n/g, d/g]; }
function decToFrac(s){ const [i,f=''] = s.split('.'); return frac(BigInt(i+f), 10n**BigInt(f.length)); }
function parseValue(text, unit){
  let s = String(text).trim().replace(/\s+/g,' ');
  const aliases = unit ? (UNIT_ALIASES[unit] || [unit]) : [];
  [...aliases, unit].filter(Boolean).sort((a,b)=>b.length-a.length).some(u => { if (s.endsWith(u)) { s = s.slice(0, -u.length).trim(); return true; } });
  s = s.replace(/[개명번권장마리대자루컵배바퀴쪽원가지시간살일]$/,'').trim();   // "12개"처럼 셈 단위가 붙은 경우
  if (s.includes(',')) { if (!/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) throw '쉼표'; s = s.replace(/,/g,''); }
  let m = s.match(/^(\d+)\s*(?:와|과|\s)\s*(\d+)\s*\/\s*(\d+)$/);
  if (m) { const w=BigInt(m[1]), n=BigInt(m[2]), d=BigInt(m[3]); if (d===0n || n>=d) throw '대분수'; return {v: frac(w*d+n, d), raw:[n,d]}; }
  m = s.match(/^(\d+)\s*\/\s*(\d+)$/); if (m) return {v: frac(m[1], m[2]), raw:[BigInt(m[1]),BigInt(m[2])]};
  if (/^\d+(\.\d+)?$/.test(s)) return {v: decToFrac(s), raw:null};
  throw '형식';
}
function storedValue(v){ const s=String(v); if (s.includes('/')){ const [n,d]=s.split('/'); return frac(n,d); } return s.includes('.') ? decToFrac(s) : frac(s,1); }
function grade(q, text){
  if (!String(text).trim()) return {ok:false, msg:'답을 입력해 주세요.', empty:true};
  try {
    const p = parseValue(text, q.a.unit), want = storedValue(q.a.value);
    const ok = p.v[0] === want[0] && p.v[1] === want[1];
    if (ok && q.a.simp && p.raw && gcd(p.raw[0], p.raw[1]) !== 1n) return {ok:false, msg:'값은 맞아요! 더 간단한 분수(기약분수)로 써 보세요.', retry:true};
    return {ok};
  } catch(e) { return {ok:false, msg:'숫자, 분수(3/4), 대분수(1과 3/4) 형태로 써 주세요.', retry:true}; }
}

/* ---------- 연산 준비 문제 (정답을 정수 계산으로 만드는 안전한 계산 문제) ---------- */
function rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function arithFor(g){
  const out = [];
  for (let i=0;i<3;i++){
    let stem, ans, kind = (i + rnd(0,2)) % 3;
    if (g === 4){
      if (kind===0){ const a=rnd(120,899), b=rnd(12,68); stem=`${a} × ${b} = ?`; ans=String(a*b); }
      else if (kind===1){ const b=rnd(12,49), q=rnd(11,39); stem=`${b*q} ÷ ${b} = ?`; ans=String(q); }
      else { const a=rnd(10,99)*100+rnd(1,99), b=rnd(10,99)*100+rnd(1,99); stem=`${a} + ${b} = ?`; ans=String(a+b); }
    } else if (g === 5){
      if (kind===0){ const a=rnd(20,60), b=rnd(2,9), c=rnd(2,9); stem=`${a} + ${b} × ${c} = ?`; ans=String(a+b*c); }
      else if (kind===1){ const c=rnd(2,9), q=rnd(3,12), b=rnd(1,20); stem=`(${c*q+b} − ${b}) ÷ ${c} = ?`; ans=String(q); }
      else { const a=rnd(2,9), b=rnd(2,9), c=rnd(10,40); stem=`${c} − ${a} × ${b} ÷ ${a} = ?`; ans=String(c-b); }
    } else {
      if (kind===0){ const a=rnd(11,49), b=rnd(2,9); stem=`${(a/10).toFixed(1)} × ${b} = ?`; const p=a*b; ans=(p%10? (p/10).toFixed(1) : String(p/10)); }
      else if (kind===1){ const d=[2,4,5,8][rnd(0,3)], k=rnd(2,9); stem=`${k} ÷ 1/${d} = ?`; ans=String(k*d); }
      else { const b=rnd(2,9), q=rnd(2,15); stem=`${(b*q/10).toFixed(1)} ÷ ${b} = ?`; ans=(q%10? (q/10).toFixed(1) : String(q/10)); }
    }
    out.push({id:'ARITH-'+i, stem, a:{value:ans, display:ans, unit:'', simp:false}, hints:[], steps:[], arith:true});
  }
  return out;
}

/* ---------- 오늘의 미션 만들기 ---------- */
function unseen(list){ return list.filter(q => !S.seen[q.id]); }
function pickFromFamily(fam, avoid){ const pool = byFam[fam] || []; const u = unseen(pool).filter(q=>!avoid.includes(q.id)); const src = u.length ? u : pool.filter(q=>!avoid.includes(q.id)); return src.length ? src[Math.floor(Math.random()*src.length)] : null; }
function newMission(unitId){
  const u = unitById[unitId], qs = byUnit[unitId] || [];
  const fams = [...new Set(qs.map(q=>q.f))];
  const famsBy = d => fams.filter(f => byFam[f][0].d === d);
  const used = [];
  const take = f => { const q = pickFromFamily(f, used); if (q) used.push(q.id); return q && q.id; };
  const cnt = PROGRESS.missionCounts(S), spread = (fs, k) => fs.length ? Array.from({length:k}, (_, i) => fs[i % fs.length]) : [];   // 유형을 번갈아 k문제 (기본 10 → 5+5, 응용 5 → 3+2)
  const basic = spread(famsBy(1).slice(0,2), cnt.basic).map(take).filter(Boolean);
  const advOpen = PROGRESS.unitStage(S, D, unitId).stage >= 3;              // 🌳 이상일 때만 심화
  const app = spread(advOpen ? [...famsBy(2).slice(0,1), ...famsBy(3).slice(0,1)] : famsBy(2).slice(0,2), cnt.app).map(take).filter(Boolean);
  // 지난번 '혼자 풀기 확인'을 못 마친 유형은 오늘 오답 확인에 먼저 넣는다
  const carry = S.wrong.filter(w => w.repair === 'pending').map(w => ({fam:w.f, orig:w.qid, tries:[], status:'todo', carried:true}));
  // 오늘 ⚡ 연산 훈련을 이미 했으면 미션의 연산 준비는 건너뜀 (오늘의 코스에서 이미 함)
  const drilled = ((S.drill && S.drill.log) || []).some(r => r.date === today());
  return {date: today(), unitId, grade: u.g, step: drilled ? 'concept' : 'arith', arithSkipped: drilled, idx:0, arith: arithFor(u.g), basic, app, advOpen,
          res:{}, repairs: carry, reflect:{feel:null, text:''}, status:'in_progress'};
}

/* ---------- 화면 ---------- */
let page = 'home', cur = {input:'', fb:null, hint:false};
function go(p){ page = p; cur = {input:'', fb:null, hint:false}; render(); window.scrollTo(0,0); }
const $ = id => document.getElementById(id);
function esc(t){ return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- 연산 준비 시계 (위에 고정) — 제한 시간 없음, 내 기록만 잰다 (2026-11-12) ---- */
const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
function drawTimer(){
  const A = S.active, on = page === 'mission' && A && A.step === 'arith' && A.arithStart && A.arithSec == null;
  $('tbar').style.display = on ? 'flex' : 'none'; if (!on) return;
  $('tclock').textContent = mmss((Date.now() - A.arithStart) / 1000);
  const sh = A.sh && A.sh.step === 'arith' ? A.sh : null, done = sh ? A.arith.filter((x, k) => (sh.inp[k] || '').trim()).length : 0;
  $('tfill').style.width = (done / A.arith.length * 100) + '%';
  $('tlab').textContent = '⏱ 내 기록 재는 중 · 서두르지 말고 정확하게!';
}
// 지난 미션의 연산 준비 기록(실수 0인 것만 기록으로 인정)
function arithHistory(A){ return Object.entries(S.days).filter(([d,x]) => d < A.date && x.arith && !x.arith.wrong && (!x.arith.grade || x.arith.grade === A.grade)).sort().map(([d,x]) => ({date:d, sec:x.arith.sec})); }
function arithNote(A){
  if (A.arithWrong) return `실수 ${A.arithWrong}개 — 기록은 실수 0일 때만 인정돼요. 정확하면 속도는 저절로 붙어요!`;
  const h = arithHistory(A); if (!h.length) return '실수 0! 첫 기록이에요. 다음 미션에서 이 기록을 깨 봐요.';
  const best = Math.min(...h.map(x => x.sec)), last = h[h.length - 1].sec;

    const d = S.days[A.date] || (S.days[A.date] = {status:'in_progress', unitId:A.unitId}); d.arith = {sec:A.arithSec, wrong:A.arithWrong||0, grade:A.grade}; }
  if (keyMap[step]) award(keyMap[step]);
  const order = STEP_ORDER; let next = order[order.indexOf(step)+1];
  if (next === 'repair') { buildRepairs(A); if (!A.repairs.some(r => r.status !== 'success' && r.status !== 'pending')) next = 'reflect'; }
  A.step = next; A.idx = 0; cur = {input:'', fb:null, hint:false}; save(); render(); window.scrollTo(0,0);
}
function logAttempt(q, ans, ok, hint, mode){ S.attempts.push({qid:q.id, v:q.v, f:q.f, u:q.u, date:today(), at:new Date().toISOString(), ans:String(ans), ok, hint:!!hint, mode}); }
function addWrong(q, ans){
  if (S.wrong.some(w => w.qid === q.id)) return;              // 같은 문제는 한 번만 오답 목록에
  S.wrong.push({qid:q.id, v:q.v, f:q.f, u:q.u, date:today(), repair:'todo', sat:'todo', ans: ans == null ? '' : String(ans)});
}

/* ---- 오답 확인: 같은 유형, 숫자만 바뀐 새 문제를 도움 없이 ---- */
function buildRepairs(A){
  const todayWrongFams = [...new Set(Object.entries(A.res).filter(([,r]) => !r.ok).map(([id]) => byId[id].f))];
  todayWrongFams.forEach(f => { if (!A.repairs.some(r => r.fam === f)) A.repairs.push({fam:f, orig: Object.keys(A.res).find(id => byId[id].f===f && !A.res[id].ok), tries:[], status:'todo'}); });
  A.repairs.forEach(r => { if (r.status === 'todo' && !r.cur) r.cur = pickRepairQ(r); });
}
function pickRepairQ(r){ const avoid = [r.orig, ...r.tries.map(t=>t.qid)]; const q = pickFromFamily(r.fam, avoid); return q ? q.id : null; }
function repairView(A){
  const r = A.repairs.find(x => x.status === 'todo' || x.status === 'studying');
  if (!r) { return `<div class="card center"><p>오답 확인을 모두 마쳤어요!</p><button class="btn" onclick="finishStep('repair')">돌아보기로 →</button></div>`; }
  const k = A.repairs.indexOf(r) + 1, n = A.repairs.length;
  if (!r.cur) { r.status = 'pending'; save(); return `<div class="card"><p>이 유형은 확인 문제가 아직 준비 중이에요. 다음에 이어서 해요.</p><button class="btn" onclick="render()">다음 →</button></div>`; }
  const q = byId[r.cur], orig = byId[r.orig];
  const intro = `<div class="card"><h3>🔁 오답 확인 ${k} / ${n}${r.carried?' <span class="tag y">지난번에 이어서</span>':''}</h3>
    <p class="muted">${orig?`아까 틀린 문제: “${esc(orig.stem)}”<br>`:''}해설로 배운 방법을 써서, <b>숫자가 바뀐 새 문제</b>를 힌트 없이 혼자 풀어 봐요. (${r.tries.length+1}번째 도전, 최대 ${MAX_REPAIR_TRIES}번)</p></div>`;
  return intro + questionCardRepair(q);
}
function questionCardRepair(q){
  const fb = cur.fb;
  let fbHtml = '';
  if (fb) {
    fbHtml = fb.ok ? `<div class="fb ok pop">🎉 스스로 해결했어요! 정답 <b>${esc(q.a.display)}${q.a.unit?' '+esc(q.a.unit):''}</b></div>`
      : `<div class="fb no pop">❌ 정답은 <b>${esc(q.a.display)}${q.a.unit?' '+esc(q.a.unit):''}</b>예요.<div style="margin-top:8px"><b>📖 해설</b><ol>${q.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div></div>`;
    fbHtml += `<button class="btn" id="nextBtn" onclick="nextRepair()">다음 →</button>`;
  }
  return `<div class="card"><div class="q">${esc(q.stem)}${q.img?`<img src="${esc(q.img.src)}" alt="${esc(q.img.alt)}">`:''}</div>
    <div class="answer"><input id="ans" ${fb?'disabled':''} value="${esc(cur.input)}" placeholder="답" autocomplete="off" oninput="cur.input=this.value">${q.a.unit?`<span class="unit">${esc(q.a.unit)}</span>`:''}</div>
    ${cur.msg?`<p class="muted" style="color:var(--red)">${esc(cur.msg)}</p>`:''}
    ${fb ? '' : `<div style="margin-top:12px"><button class="btn" id="checkBtn" onclick="checkRepair()">정답 확인</button></div>`}${fbHtml}</div>`;
}
function checkRepair(){
  const A = S.active, r = A.repairs.find(x => x.status === 'todo'), q = byId[r.cur], g = grade(q, cur.input);
  if (g.empty || g.retry) { cur.msg = g.msg; render(); return; }
  cur.msg = ''; cur.fb = g; S.seen[q.id] = true; logAttempt(q, cur.input, g.ok, false, 'repair');
  r.tries.push({qid:q.id, ok:g.ok});
  save(); render();
}
function nextRepair(){
  const A = S.active, r = A.repairs.find(x => x.status === 'todo'), last = r.tries[r.tries.length-1];
  if (last.ok) { r.status = 'success'; S.wrong.filter(w => w.f === r.fam && w.repair !== 'success').forEach(w => { w.repair = 'success'; w.repairDate = today(); }); }
  else if (r.tries.length >= MAX_REPAIR_TRIES) { r.status = 'pending'; S.wrong.filter(w => w.f === r.fam).forEach(w => { if (w.repair !== 'success') w.repair = 'pending'; });
    alert('이 유형은 오늘 여기까지 해요. 해설을 한 번 더 읽어 두고, 다음 미션에서 다시 확인해요. 충분히 잘하고 있어요!'); }
  else { r.cur = pickRepairQ(r); if (!r.cur) r.status = 'pending'; }
  cur = {input:'', fb:null, hint:false};
  if (!A.repairs.some(x => x.status === 'todo')) { finishStep('repair'); return; }
  save(); render();
}

/* ---- 🏁 단원 마무리 테스트: 🌳 능숙이 된 단원을 기본 5 · 응용 5 · 심화 5, 힌트·해설 없이 (2026-11-25) ---- */
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startTest(uid){
  if (S.utest && S.utest.date === today()) { go('test'); return; }
  if (!uid) return;
  const fams = [...new Set((byUnit[uid] || []).map(q => q.f))], items = [], lv = [];
  [1, 2, 3].forEach(d => { const fs = shuffle(fams.filter(f => byFam[f][0].d === d)), want = PROGRESS.TEST.per[d];
    for (let i = 0, got = 0; fs.length && got < want && i < want * 4; i++) { const q = pickFromFamily(fs[i % fs.length], items); if (q) { items.push(q.id); lv.push(d); got++; } } });
  if (!items.length) { alert('이 단원은 테스트 문제가 아직 없어요.'); return; }
  S.utest = {date: today(), uid, items, lv, idx: 0}; save(); go('test');
}
function saveTestResult(c){

  const r = {date: today(), k: PROGRESS.lessonNo(S), at: new Date().toISOString(), b: cnt(1), a: cnt(2), v: cnt(3), sec: c.sh.startAt ? Math.round((Date.now() - c.sh.startAt) / 1000) : null};
  r.ok = r.b[0] + r.a[0] + r.v[0]; r.n = r.b[1] + r.a[1] + r.v[1]; r.verdict = PROGRESS.testVerdict(r).name; T.result = r;
  S.tests = S.tests || {}; (S.tests[T.uid] ||= []).push(r);
}

    <p class="muted">총 ${r.ok}/${r.n}${r.sec ? ` · ${Math.floor(r.sec / 60)}분 ${r.sec % 60}초` : ''}<br>${esc(v.tip)}</p></div>`;

  <button class="btn ghost" style="color:var(--red)" onclick="resetAll()">모든 기록 지우기</button></div>`;
}
