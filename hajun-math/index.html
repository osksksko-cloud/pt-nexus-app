danger{border:0;border-radius:13px;padding:12px 18px;font-weight:900;transition:transform .15s}.primary:hover,.secondary:hover,.soft:hover{transform:translateY(-1px)}.primary{background:var(--green);color:white}.secondary{background:var(--navy);color:white}.soft{background:#edf4f1;color:var(--navy)}.danger{background:#fff0eb;color:var(--red)}.hero .primary{background:#ffe0a5;color:#463000;margin-top:22px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:17px}.mode-card,.panel{background:white;border:1px solid var(--stroke);border-radius:22px;padding:22px;box-shadow:0 7px 28px #132f3b0a}.mode-card{display:flex;flex-direction:column;gap:11px}.mode-card .emoji{width:49px;height:49px;border-radius:15px;display:grid;place-items:center;background:#ecf6fb;font-size:25px}.mode-card:nth-child(2) .emoji{background:#fff2e6}.mode-card:nth-child(3) .emoji{background:#f0eafb}.mode-card h3,.panel h3{margin:0;font-size:20px}.mode-card p,.help{color:var(--muted);font-size:14px;margin:0}.mode-card button{margin-top:auto;align-self:flex-start}.section-head{display:flex;align-items:end;justify-content:space-between;margin:27px 0 14px;gap:12px}.section-head h2{font-size:22px;margin:0}.section-head small{color:var(--muted)}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.stat{background:#fff;border:1px solid var(--stroke);border-radius:16px;padding:15px}.stat strong{display:block;font-size:25px;line-height:1.2;color:var(--navy)}.stat span{color:var(--muted);font-size:12px}.unitgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.unit{background:#fff;border:1px solid var(--stroke);padding:14px;border-radius:14px;font-size:14px}.unit b{display:block;font-size:14px}.unit small{color:var(--muted)}.divider{height:1px;background:var(--stroke);margin:18px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.tag{font-size:12px;font-weight:900;border:1px solid #d8e5e0;background:#f2f7f4;color:#4f7568;border-radius:99px;padding:5px 10px}.tag.gold{background:#fff1dc;border-color:#f7dbb3;color:#91621c}.tag.blue{background:#eef5fd;border-color:#d9e7f8;color:#4774a9}.question-shell{max-width:790px;margin:15px auto}.progress-track{height:10px;background:#e1eae5;border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#3ca78b,#a8d99b);border-radius:99px}.question{background:#fff;border:1px solid var(--stroke);border-radius:25px;padding:clamp(20px,4vw,38px);box-shadow:0 15px 45px #13334610;margin-top:18px}.question h2{font-size:clamp(21px,3vw,28px);line-height:1.55;margin:17px 0 22px;white-space:pre-line;letter-spacing:-.016em}.answers{display:grid;gap:11px}.answer{padding:15px 18px;border:2px solid var(--stroke);background:white;border-radius:13px;text-align:left;font-size:17px;font-weight:800;color:var(--ink)}.answer:hover{border-color:#91cbb5;background:#f6fcf9}.answer.selected{border-color:var(--green);background:#eaf9f1}.answer .key{display:inline-grid;place-items:center;min-width:29px;height:29px;margin-right:12px;border-radius:8px;background:#eef3f1;color:#608575}.answer.selected .key{background:var(--green);color:white}.ansinput{border:2px solid var(--stroke);border-radius:13px;padding:15px 18px;width:100%;font-size:22px;font-weight:800;outline:none;color:var(--navy)}.ansinput:focus{border-color:var(--green)}.qfooter{display:flex;gap:12px;justify-content:space-between;margin-top:25px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.confbox{margin-top:22px;padding:13px 14px;background:#f6f9f7;border-radius:13px}.confbox label{margin-right:14px;font-size:14px;display:inline-flex;align-items:center;gap:5px}.confbox input{accent-color:var(--green)}.feedback{padding:18px;background:#f1f7f4;border:1px solid #cce8da;border-radius:15px;margin-top:20px}.feedback.wrong{background:#fff7ee;border-color:#f4dfc6}.feedback b{font-size:18px}.feedback p{margin:8px 0 0}.insight{padding:14px;border-left:4px solid var(--orange);background:#fffbf3;border-radius:8px;margin:10px 0;color:#61513d}.resultmark{font-size:55px}.bigscore{font-size:52px;line-height:1.1;font-weight:900;color:var(--navy)}.barrow{display:grid;grid-template-columns:140px 1fr 58px;align-items:center;gap:12px;margin:11px 0;font-size:14px}.track{height:11px;background:#ebf0ed;border-radius:100px;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:100px}.fill.mid{background:#f1b351}.fill.low{background:#e38171}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0ee;vertical-align:top}th{color:#7d8c91;font-weight:900;font-size:12px}.status{font-weight:900}.status.ok{color:var(--green)}.status.no{color:var(--red)}.micro{font-size:12px;color:var(--muted)}.review-item{border-bottom:1px solid var(--stroke);padding:13px 0}.review-item:last-child{border-bottom:0}.review-item p{margin:6px 0}.sel{width:100%;max-width:275px;border:1px solid var(--stroke);border-radius:9px;background:white;padding:8px;color:var(--ink)}.empty{text-align:center;padding:55px 15px}.empty .emoji{font-size:55px}.footer{text-align:center;color:#8a9496;font-size:12px;margin-top:38px}.hide{display:none!important}.miniBtn{background:#fff;border:1px solid var(--stroke);padding:8px 11px;border-radius:10px;font-size:13px;font-weight:800;color:var(--ink)}.notice{font-size:13px;color:#687781;border:1px dashed #cdded8;background:#f8fcfa;border-radius:12px;padding:13px 15px}.inline-actions{display:flex;flex-wrap:wrap;gap:9px}.callout{background:#edf8f3;border:1px solid #ccebdc;padding:18px;border-radius:18px}.highlight{color:#c08327}.loader{color:var(--muted)}

<script>const DB={"version":"2.0","curriculum":"2022 개정 교육과정의 5~6학년군 성취기준 참고; 5-1 단원 순서는 일반적인 교과서 배열이며 출판사별 차이가 있을 수 있음","active_question_count":87,"archived_question_count":1,"units":[{"unit_id":"U01","term":"4-1","unit":"큰 수","domain":"수와 연산","concept":"큰 수는 네 자리씩 끊어 만·억 단위로 읽어요. 자릿값을 맞춰 더하고 비교해요.","example":"400만+7만=407만=4,070,000이에요.","check":"개념을 말로 설명한 뒤 문제를 풀어 보세요."},{"unit_id":"U02","term":"4-1","unit":"각도","domain":"도형과 측정","concept":"직각은 90°, 일직선은 180°, 한 점 둘레는 360°예요.","example":"90°에서 35°를 빼면 55°예요.","check":"개념을 말로 설명한 뒤 문제를 풀어 보세요."},{"unit_id":"U03","term":"4-1","unit":"곱셈과 나눗셈","domain":"수와 연산","concept":"자릿값을 맞춰 계산하고 곱셈과 나눗셈으로 서로 검산해요.","example":"936÷24=39이므로 24×39=936이에요.","check":"개념을 말로 설명한 뒤 문제를 풀어 보세요."},{"unit_id":"U04","term":"4-1","unit":"평면도형의 이동","domain":"도형과 측정","concept":"도형을 밀기, 뒤집기, 돌리기 할 때 방향과 거리를 확인해요.","example":"위쪽 화살표를 시계 방향으로 90° 돌리면 오른쪽이에요.","check":"개념을 말로 설명한 뒤 문제를 풀어 보세요."},{"unit_id":"U05","term":"4-1","unit":"막대그래프","domain":"자료와 가능성","concept":"막대의 길이로 크기를 비교하고 축의 한 칸이 뜻하는 값을 확인해요.","example":"월 14명, 화 23명이라면 화요일이 9명 많아요.","check":"개념을 말로 설명한 뒤 문제를 풀어 보세요."},{"unit_id":"U06","term":"4-1","unit":"규칙 찾기","domain":"변화와 관계","concept":"이웃한 수의 차이 또는 배수를 찾아 다음 값에도 맞는지 확인해요.","example":"4, 9, 14는 5씩 커져서 다음은 19예요.","check":"개념을 말로 설명한 뒤 문제를 풀어 보세요."},{"unit_id":"U07","term":"4-2","unit":"분수의 덧셈과 뺄셈","domain":"수와 연산","concept":"분모가 같을 때 분자끼리 계산해요. 대분수는 자연수와 분수 부분을 함께 살펴요.","example":"3/7+2/7=5/7이에요.","check":"개념을 말로 설명한 뒤 문제를 풀어 보세요."},{"unit_id":"U08","term":"4-2","unit":"삼각형","domain":"도형과 측정","concept":"세 각의 합은 180°예요. 두 변이나 두 각이 같은 삼각형의 성질을 살펴요.","example":"각 65°, 65°가 있으면 나머지는 50°예요.","check":"개념을 말로 설명한 뒤 문제를 풀어 보세요."},{"unit_id":"U09","term":"4-2","unit":"소수의 덧셈과 뺄셈","domain":"수와 연산","concept":"소수점을 세로로 맞춰 같은 자릿값끼리 계산해요.","example":"3.7+2.85=6.55예요.","check":"개념을 말로 설명한 뒤 문제를 풀어 보세요."},{"unit_id":"U10","term":"4-2","unit":"사각형","domain":"도형과 측정","concept":"사각형마다 평행한 변과 직각의 수가 달라요. 둘레는 네 변의 합이에요.","example":"8cm×5cm 직사각형의 둘레는 2×(8+5)=26cm예요.","check":"개념을 말로 설명한 뒤 문제를 풀어 보세요."},{"unit_id":"U11","term":"4-2","unit":"꺾은선그래프","domain":"자료와 가능성","concept":"점의 높이와 선의 기울기로 값의 변화를 읽어요. 처음과 끝의 차이와 중간 상승량은 달라요.","example":"12°에서 17°로 바뀌면 5° 오른 거예요.","check":"개념을 말로 설명한 뒤 문제를 풀어 보세요."},{"unit_id":"U12","term":"4-2","unit":"다각형","domain":"도형과 측정","concept":"변이 여러 개인 닫힌 도형이에요. 변의 수와 꼭짓점의 수가 같아요.","example":"오각형은 변 5개, 꼭짓점 5개예요.","check":"개념을 말로 설명한 뒤 문제를 풀어 보세요."},{"unit_id":"F01","term":"5-1","unit":"자연수의 혼합 계산","domain":"수와 연산","concept":"괄호 안을 먼저, 그다음 곱셈·나눗셈, 마지막으로 덧셈·뺄셈을 계산해요. 같은 순위는 왼쪽부터 풀어요.","example":"18−(6+2)÷4 = 18−2 = 16","check":"연산 순서를 말로 설명할 수 있는지 확인"},{"unit_id":"F02","term":"5-1","unit":"약수와 배수","domain":"수와 연산","concept":"약수는 어떤 수를 나누어떨어지게 하는 수예요. 공약수는 두 수의 공통 약수, 공배수는 공통 배수예요.","example":"12의 약수는 1, 2, 3, 4, 6, 12예요. 12와 18의 최대공약수는 6이에요.","check":"약수와 배수의 뜻을 식으로 설명"},{"unit_id":"F03","term":"5-1","unit":"규칙과 대응","domain":"변화와 관계","concept":"두 양이 함께 바뀌는 규칙을 표에서 찾아요. 같은 규칙이 다른 값에도 맞는지 확인해요.","example":"입력 1, 2, 3에 출력 4, 7, 10이면 출력은 입력×3+1이에요.","check":"표에서 규칙을 찾고 다른 수로 검증"},{"unit_id":"F04","term":"5-1","unit":"약분과 통분","domain":"수와 연산","concept":"분자와 분모를 같은 수로 나누면 약분, 같은 수를 곱해 분모를 맞추면 통분이에요. 분수의 크기는 바뀌지 않아요.","example":"6/8은 3/4로 약분해요. 1/2과 1/3은 3/6과 2/6으로 통분해요.","check":"분모를 맞춘 뒤 크기 비교"},{"unit_id":"F05","term":"5-1","unit":"분수의 덧셈과 뺄셈","domain":"수와 연산","concept":"분모가 다르면 먼저 통분하고 분자끼리 더하거나 빼요. 마지막에는 약분해요.","example":"1/2+1/3 = 3/6+2/6 = 5/6이에요.","check":"계산 전 통분 이유 설명"},{"unit_id":"F06","term":"5-1","unit":"다각형의 둘레와 넓이","domain":"도형과 측정","concept":"둘레는 테두리 길이의 합, 넓이는 내부를 덮는 단위 정사각형의 수예요. 도형에 맞는 공식을 골라요.","example":"직사각형 가로 8cm, 세로 5cm이면 넓이는 40㎠, 둘레는 26cm예요.","check":"단위 cm와 ㎠를 구별"}],"questions":[{"id":"M4-U01-01","grade":4,"term":"4-1","unit_id":"U01","unit":"큰 수","domain":"수와 연산","level":1,"skill":"큰 수의 자릿값","stem":"400만과 7만을 합하면 얼마인가요?","kind":"input","options":[],"answer":"4070000","explanation":"400만=4,000,000이고 7만=70,000이므로 4,070,000입니다.","hint":"만은 10,000을 뜻해요.","misconception":"자릿값 혼동","role":"diagnostic","source":"초4 자체 제작 원본; 문항별 검토 2026-10-26","reviewed_on":"2026-10-26"},{"id":"M4-U01-02","grade":4,"term":"4-1","unit_id":"U01","unit":"큰 수","domain":"수와 연산","level":1,"skill":"큰 수의 읽기","stem":"8,999,999보다 1 큰 수는 무엇인가요?","kind":"input","options":[],"answer":"9000000","explanation":"8,999,999에 1을 더하면 9,000,000입니다.","hint":"자리 올림을 차례대로 확인하세요.","misconception":"자리 올림 실수","role":"diagnostic","source":"초4 자체 제작 원본; 문항별 검토 2026-10-26","reviewed_on":"2026-10-26"},{"id":"M4-U01-03","grade":4,"term":"4-1","unit_id":"U01","unit":"큰 수","domain":"수와 연산","level":2,"skill":"큰 수 비교","stem":"32,089,999와 32,090,001 중 더 큰 수를 고르세요.","kind":"choice","options":["32,089,999","32,090,001","같다","비교할 수 없다"],"answer":"32,090,001","explanation":"앞에서부터 비교하면 3,209만 1이 3,208만 9,999보다 큽니다. 두 수의 차이는 2입니다.","hint":"세 자리씩 끊어 비교해 보세요.","misconception":"자리수 비교 오류","role":"practice","source":"초4 자체 제작 원본; 문항별 검토 2026-10-26","reviewed_on":"2026-10-26"},{"id":"M4-U01-04","grade":4,"term":"4-1","unit_id":"U01","unit":"큰 수","domain":"수와 연산","level":2,"skill":"큰 수 반올림","stem":"2,648,000을 만의 자리까지 반올림하면?","kind":"choice","options":["2,600,000","2,640,000","2,650,000","2,700,000"],"answer":"2,650,000","explanation":"만의 자리 오른쪽 천의 자리는 8이므로 만의 자리를 올려 2,650,000입니다.","hint":"반올림할 자리의 바로 오른쪽 숫자를 보세요.","misconception":"반올림 자리 혼동","role":"practice","source":"초4 자체 제작 원본; 문항별 검토 2026-10-26","reviewed_on":"2026-10-26"},{"id":"M4-U02-01","grade":4,"term":"4-1","unit_id":"U02","unit":"각도","domain":"도형과 측정","level":1,"skill":"각도","stem":"삼각형의 두 각이 47°, 68°일 때 나머지 각은 몇 도인가요? (숫자만 입력)","kind":"input","options":[],"answer":"65","explanation":"삼각형 세 각의 합은 180°입니다. 180−47−68=65°입니다.","hint":"세 내각을 모두 더하면 일정한 각도가 돼요.","misconception":"각의 합 개념/뺄셈 오류","role":"diagnostic","source":"초4 자체 제작 원본; 문항별 검토 2026-10-26","reviewed_on":"2026-10-26"},{"id":"M4-U02-02","grade":4,"term":"4-1","unit_id":"U02","unit":"각도","domain":"도형과 측정","level":1,"skill":"직각과 각도","stem":"직각에서 35°를 뺀 각의 크기는 몇 도인가요?","kind":"inpu if(!l)return `<section class="hero"><div class="eyebrow">START HERE · 첫 수학 진단</div><h1>하준아, 먼저 지금 실력을<br>함께 알아보자!</h1><p>초4 기초 12문항, 초5-1 선행 6문항, 사고력 2문항을 풀어요. 약 25~35분. 계산은 연습장에 하고, 모르면 추측했다고 표시해도 괜찮아.</p><button class="primary" onclick="start('diagnostic')">첫 진단 시작하기 →</button></section><div class="panel" style="margin-top:18px"><h3>진단을 마친 다음</h3><p class="help">틀린 개념부터 짧게 설명하고 기본·적용 문제를 풀어요. 이미 쓰는 연산 문제집은 그대로 병행하고, 5-1은 준비된 단원부터 선행해요. 사고력은 풀이 이유를 말하는 연습부터 시작합니다.</p></div>${state.active?`<div class="panel" style="margin-top:18px"><button class="secondary" onclick="resumeQuiz()">진행 중인 진단 이어하기</button></div>`:''}`;
let g4=l.responses.filter(r=>byId[r.qid]?.grade===4&&byId[r.qid]?.role!=='challenge'),g5=l.responses.filter(r=>byId[r.qid]?.term==='5-1'),think=l.responses.filter(r=>byId[r.qid]?.role==='challenge');let p=xs=>xs.length?Math.round(xs.filter(r=>r.correct).length/xs.length*100):0;
return `<section class="hero"><div class="eyebrow">MATH EXPLORER · STEP BY STEP</div><h1>오늘은 한 개념씩<br>더 깊게 생각해 보자!</h1><p>첫 진단을 마쳤어요. 4학년 빈틈을 확인하고, 5학년 1학기 선행과 사고력으로 이어가요.</p><button class="primary" onclick="setPage('report')">나의 학습 경로 보기 →</button></section><div class="statgrid"><div class="stat"><strong>${p(g4)}%</strong><span>초4 첫 진단</span></div><div class="stat"><strong>${p(g5)}%</strong><span>초5-1 첫 진단</span></div><div class="stat"><strong>${p(think)}%</strong><span>사고력 첫 진단</span></div><div class="stat"><strong>${att.length}</strong><span>푼 문제 기록</span></div></div><div class="section-head"><h2>다음 학습</h2></div><div class="grid3"><article class="mode-card"><div class="emoji">📘</div><h3>개념부터</h3><p>초4·초5-1 단원에서 짧은 설명과 예제를 보고 문제를 풀어요.</p><button class="secondary" onclick="setPage('units')">단원 선택</button></article><article class="mode-card"><div class="emoji">🔄</div><h3>오답 복습</h3><p>틀렸거나 추측한 문제를 다시 풀고 이유를 기록해요.</p><button class="secondary" onclick="start('review')">다시 풀기</button></article><article class="mode-card"><div class="emoji">🏆</div><h3>사고력 도전</h3><p>규칙·논리·경우의 수를 먼저 설명하고 풀어요.</p><button class="secondary" onclick="start('challenge')">5문제 도전</button></article></div>${state.active?`<div class="panel" style="margin-top:18px"><button class="secondary" onclick="resumeQuiz()">진행 중인 문제 이어하기</button></div>`:''}<p class="notice" style="margin-top:18px">새 단원은 이전 단원 개념을 설명하고 적용 문제까지 풀 수 있을 때 진행하세요. 점수 하나만으로 선행 여부를 결정하지 않아요.</p>`}
function resumeQuiz(){if(state.active){page='quiz';resetQ();render()}}

function start(mode,unitId,tier){if(state.active?.responses?.length&&!confirm('진행 중인 문제를 멈추고 새 학습을 시작할까요?'))return;let qs;if(mode==='diagnostic'){let round=state.sessions.filter(s=>s.mode==='diagnostic'&&s.responses.some(r=>byId[r.qid]?.term==='5-1')).length%2;let g4=DB.units.filter(u=>u.term.startsWith('4-')).map(u=>DIAG.filter(q=>q.unit_id===u.unit_id)[round]||DIAG.find(q=>q.unit_id===u.unit_id));let g5=DB.units.filter(u=>u.term==='5-1').map(u=>QUESTIONS.find(q=>q.unit_id===u.unit_id&&(round?q.id.endsWith('-02'):q.role==='placement')));let reasoning=round?['C4-08','C5-02']:['C4-04','C4-01'];qs=[...g4,...g5,...reasoning.map(id=>byId[id])].map(q=>q.id)}else if(mode==='challenge'){let seen=new Set(state.sessions.filter(s=>s.mode==='challenge').flatMap(s=>s.responses.filter(r=>r.correct).map(r=>r.qid)));let pool=CHALLENGE.filter(q=>tier===1?q.level<=6:tier===2?q.level===7:tier===3?q.level>=8:true);qs=randomize(pool).sort((a,b)=>Number(seen.has(a.id))-Number(seen.has(b.id))||a.level-b.level).slice(0,5).map(q=>q.id)}else if(mode==='review'){let recent=state.sessions.flatMap(s=>s.responses).filter(r=>!r.correct||r.confidence!=='sure');qs=randomize([...new Set(recent.map(r=>r.qid))]).slice(0,10);if(!qs.length){alert('복습할 문제가 아직 없어요. 개념 학습에서 시작해요.');return setPage('units')}}else{let pool=unitId?QUESTIONS.filter(q=>q.unit_id===unitId&&q.role!=='challenge'&&q.role!=='archive'):PRACTICE;if(tier===1)pool=pool.filter(q=>q.level<=2);if(tier===2)pool=pool.filter(q=>q.level>=2);let performed=state.sessions.flatMap(s=>s.responses),wrong=new Set(performed.filter(r=>!r.correct).map(r=>r.qid)),seen=new Set(performed.map(r=>r.qid));qs=randomize(pool).sort((a,b)=>(wrong.has(a.id)?0:seen.has(a.id)?2:1)-(wrong.has(b.id)?0:seen.has(b.id)?2:1)).slice(0,10).map(q=>q.id);if(!qs.length)return alert('이 단계의 문제가 아직 없어요. 다른 단계를 선택해 주세요.')}state.active={id:'s'+Date.now(),mode,questions:qs,index:0,responses:[],startedAt:new Date().toISOString(),unitId:unitId||null};save();page='quiz';resetQ();render();window.scrollTo({top:0,behavior:'smooth'})}

function resetQ(){selected='';confidence='sure';hintUsed=false;submitted=false;qStarted=Date.now()};function current(){return state.active&&byId[state.active.questions[state.active.index]]};function quiz(){let s=state.active;if(!s)return empty('진행 중인 미션이 없어요.');let q=current(),n=s.index+1,total=s.questions.length,diagnostic=s.mode==='diagnostic',challenge=s.mode==='challenge';let choices=q.options.length?`<div class="answers">${q.options.map((a,i)=>`<button class="answer" data-answer="${esc(a)}"><span class="key">${'ABCD'[i]}</span>${esc(a)}</button>`).join('')}</div>`:`<div class="answers"><input id="ans" class="ansinput" inputmode="${q.answer.includes('/')?'text':'decimal'}" placeholder="답을 입력하세요" aria-label="정답 입력" autocomplete="off"><small class="muted">분수는 3/5처럼 입력하고, 숫자에 쉼표는 생략해도 돼요.</small></div>`;return `<div class="question-shell"><div class="row between"><b>${diagnostic?'🧭 실력 진단':challenge?'🏆 경시형 챌린지':s.mode==='review'?'🔄 오답 다시풀기':'🎯 연습 미션'}</b><span class="tag">${n} / ${total}</span></div><div style="margin-top:12px" class="progress-track"><div class="progress-fill" style="width:${(n-1)/total*100}%"></div></div><article class="question"><div class="row"><span class="tag blue">${esc(q.term)} · ${esc(q.unit)}</span><span class="tag ${q.level>6?'gold':''}">난도 ${q.level}/10</span></div><h2>${esc(q.stem)}</h2>${visual(q)}${choices}<div class="confbox"><div class="muted" style="margin-bottom:9px">이 답에 얼마나 자신 있나요? (실력 분석에 활용돼요)</div><label><input type="radio" name="confidence" value="sure" checked> 확실해요</label><label><input type="radio" name="confidence" value="unsure"> 조금 헷갈려요</label><label><input type="radio" name="confidence" value="guess"> 찍었어요</label></div><div id="qfeedback"></div><div class="qfooter"><div class="row">${diagnostic?'<span class="muted">진단 중에는 힌트가 제공되지 않아요.</span>':`<button class="miniBtn" id="hintbutton">💡 힌트 보기</button>`}</div><button class="primary" id="submitbutton" disabled>답 제출하기 →</button></div><div id="hintbox" class="hide insight"></div></article><p class="muted" style="text-align:center">${diagnostic?'점수보다 정확한 현재 실력을 확인하는 시간입니다.':'오답은 성장의 단서예요. 천천히 생각해 보세요.'}</p></div>`}
function enterSelection(v){if(submitted)return;selected=v;document.querySelectorAll('.answer').forEach(x=>x.classList.toggle('selected',x.dataset.answer===v));let b=document.getElementById('submitbutton');if(b)b.disabled=!String(v).trim()}
function submit(){let s=state.active,q=current();if(!s||submitted||!String(selected).trim())return;let conf=document.querySelector('input[name="confidence"]:checked');confidence=conf?conf.value:'sure';let r={qid:q.id,given:String(selected).trim(),correct:equal(selected,q.answer,q),seconds:Math.min(900,Math.max(1,Math.round((Date.now()-qStarted)/1000))),confidence,hintUsed,errorReason:'',at:new Date().toISOString()};s.responses.push(r);submitted=true;if(s.mode==='diagnostic'){advance();return}let f=document.getElementById('qfeedback');f.innerHTML=`<div class="feedback ${r.correct?'':'wrong'}"><b>${r.correct?'✅ 정확해요! +10 XP':'🌱 좋은 시도였어요. 다시 배우면 돼요!'}</b><p><strong>정답:</strong> ${esc(q.answer)}</p><p>${esc(q.explanation)}</p>${r.correct?'':`<div style="margin-top:13px"><label class="muted">틀린 이유를 스스로 골라봐요</label><br><select class="sel" id="reason"><option value="">원인 선택 (선택사항)</option><option>숫자를 잘못 보거나 적음</option><option>계산 과정 실수</option><option>개념을 잘 몰랐음</option><option>문제 조건을 잘못 읽음</option><option>해결 전략이 떠오르지 않음</option></select></div>`}</div>`;if(r.correct)state.xp+=10;save();let btn=document.getElementById('submitbutton');btn.textContent=s.index===s.questions.length-1?'결과 확인하기 →':'다음 문제 →';btn.disabled=false}
function advance(){let s=state.active;if(!s)return;let reason=document.getElementById('reason');if(reason&&s.responses.length)s.responses[s.responses.length-1].errorReason=reason.value;if(s.index+1<s.questions.length){s.index++;save();resetQ();render();let inp=document.getElementById('ans');if(inp)inp.focus();window.scrollTo({top:0,behavior:'smooth'})}else{let ended={...s,finishedAt:new Date().toISOString()};delete ended.index;state.sessions.push(ended);state.active=null;save();page='finish';window.finishedId=ended.id;render();window.scrollTo({top:0,behavior:'smooth'})}}
function lookupSession(){return state.sessions.find(s=>s.id===window.finishedId)||state.sessions[state.sessions.length-1]}function score(s){let num=s.responses.filter(r=>r.correct).length;return {num,total:s.responses.length,pct:s.responses.length?Math.round(num/s.responses.length*100):0}}
function finish(){let s=lookupSession();if(!s)return empty('완료한 미션이 없어요');let sc=score(s),xp=s.responses.filter(r=>r.correct).length*10;let wrong=s.responses.filter(r=>!r.correct);let uncertain=s.responses.filter(r=>r.confidence!=='sure');return `<div class="question-shell"><div class="panel" style="text-align:center"><div class="resultmark">${sc.pct>=90?'🏅':sc.pct>=60?'🌟':'🌱'}</div><p class="eyebrow">MISSION COMPLETE</p><h1>${s.mode==='diagnostic'?'첫 수학 진단 완료':'오늘의 도전 완료!'}</h1><div class="bigscore">${sc.num} / ${sc.total}</div><p class="help">정답률 ${sc.pct}% · 총 풀이 시간 ${Math.ceil(s.responses.reduce((a,r)=>a+r.seconds,0)/60)}분 · ${s.mode==='diagnostic'?'진단 중 힌트 없음':'선택한 힌트 사용 횟수 '+s.responses.filter(r=>r.hintUsed).length}</p><div class="divider"></div><div class="row" style="justify-content:center"><span class="tag">⚠️ 오답 ${wrong.length}개</span><span class="tag">🤔 헷갈림·추측 ${uncertain.length}개</span><span class="tag gold">⭐ 정확도 성취</span></div><div class="inline-actions" style="justify-content:center;margin-top:22px"><button class="secondary" onclick="setPage('report')">영역별 결과 분석</button><button class="soft" onclick="start('review')">오답 다시 풀기</button><button class="soft" onclick="setPage('units')">개념부터 학습하기</button><button class="soft" onclick="setPage('home')">홈으로</button></div></div>${s.mode==='diagnostic'?`<div class="panel" style="margin-top:18px"><h3>📌 4학년·5학년 1학기 영역별 결과</h3><p class="help">영역당 한 문항 수준의 짧은 첫 진단입니다. 틀린 영역은 개념과 추가 문제로 다시 확인하세요.</p>${renderBars(s)}</div>`:''}<div class="panel" style="margin-top:18px"><h3>🔎 해설 및 오답 원인 기록</h3><p class="help">틀린 문제의 원인을 고르면 부모님 분석 화면에 반영됩니다.</p>${s.responses.map((r,i)=>reviewHTML(r,i,s.id)).join('')}</div></div>`}
function renderBars(s){let a=s.responses.map(r=>({...r,q:byId[r.qid]}));return DB.units.map(u=>{let z=a.filter(x=>x.q.unit_id===u.unit_id);if(!z.length)return '';let p=Math.round(z.filter(x=>x.correct).length/z.length*100),style=p===100?'':p===50?'mid':'low';return `<div class="barrow"><span>${esc(u.unit)}</span><div class="track"><div class="fill ${style}" style="width:${p}%"></div></div><b>${z.filter(x=>x.correct).length}/${z.length}</b></div>`}).join('')}
function reviewHTML(r,i,sid){let q=byId[r.qid],wrong=!r.correct;return `<div class="review-item"><div class="row between"><b>${i+1}. ${esc(q.unit)} <span class="status ${wrong?'no':'ok'}">${wrong?'오답':'정답'}</span></b><small class="micro">${r.seconds}초 · ${r.confidence==='sure'?'확신':r.confidence==='unsure'?'헷갈림':'추측'}</small></div><p>${esc(q.stem)}</p><p class="micro">내 답: <b>${esc(r.given)}</b> · 정답: <b>${esc(q.answer)}</b></p><p style="font-size:13px">${esc(q.explanation)}</p>${wrong?`<label class="micro">오답 원인 분류</label><br><select class="sel" data-reason-session="${esc(sid)}" data-reason-index="${i}"><option value="">원인 미확정</option>${['숫자를 잘못 보거나 적음','계산 과정 실수','개념을 잘 몰랐음','문제 조건을 잘못 읽음','해결 전략이 떠오르지 않음'].map(x=>`<option ${r.errorReason===x?'selected':''}>${x}</option>`).join('')}</select>`:''}</div>`}
function pathSummary(s){let groups=[['초4 기초',r=>byId[r.qid]?.grade===4&&byId[r.qid]?.role!=='challenge'],['초5-1 선행',r=>byId[r.qid]?.term==='5-1'],['사고력',r=>byId[r.qid]?.role==='challenge']];return `<div class="grid3" style="margin-top:18px">${groups.map(([name,fn])=>{let a=s.responses.filter(fn),ok=a.filter(r=>r.correct).length;return `<div class="panel"><h3>${name}</h3><p><b>${ok}/${a.length}</b>개 정답</p><p class="help">${ok===a.length?'다른 문제로 다시 확인하고 적용 단계로 가요.':'틀린 개념을 설명하고 새 문제로 확인해요.'}</p></div>`}).join('')}</div><p class="notice">한 영역에 1문항인 짧은 첫 진단이므로 점수만으로 학년 수준이나 경시 준비도를 판정하지 않습니다.</p>`}
function report(){let s=latestDiag();if(!s)return `<div class="empty panel"><div class="emoji">🧭</div><h2>먼저 진단평가를 시작해 주세요.</h2><p class="help">초4, 초5-1과 사고력을 함께 보는 20문항으로 출발점을 확인합니다.</p><button class="primary" style="margin-top:16px" onclick="start('diagnostic')">진단평가 시작</button></div>`;let sc=score(s),wr=s.responses.filter(r=>!r.correct),care=wr.filter(r=>['숫자를 잘못 보거나 적음','계산 과정 실수'].includes(r.errorReason)),wrongReasons=wr.filter(r=>r.errorReason).length;let weak=DB.units.map(u=>({u,rs:s.responses.filter(r=>byId[r.qid].unit_id===u.unit_id)})).filter(x=>x.rs.length&&x.rs.some(r=>!r.correct)).sort((a,b)=>a.rs.filter(r=>r.correct).length-b.rs.filter(r=>r.correct).length);let uncertainCorrect=s.responses.filter(r=>r.correct&&r.confidence!=='sure');let hist=state.sessions.filter(x=>x.mode==='diagnostic').slice(-5);return `<div class="section-head"><h2>📊 하준이 수학 성장 리포트</h2><small>마지막 진단 ${dt(s.finishedAt)}</small></div><div class="statgrid"><div class="stat"><strong>${sc.pct}%</strong><span>최근 진단 정답률</span></div><div class="stat"><strong>${Math.round(s.responses.reduce((a,r)=>a+r.seconds,0)/s.responses.length)}초</strong><span>문항당 평균 시간</span></div><div class="stat"><strong>${wr.length}</strong><span>틀린 문제</span></div><div class="stat"><strong>${uncertainCorrect.length}</strong><span>맞혔지만 자신 없음</span></div></div>${pathSummary(s)}<div class="grid2" style="margin-top:18px"><div class="panel"><h3>영역별 정확도</h3><p class="help">초4 12영역, 초5-1 6영역, 사고력 2문항. 한 문항 결과만으로 숙달 여부를 단정하지 않아요.</p>${renderBars(s)}</div><div class="panel"><h3>🩺 학습 분석</h3>${weak.length?`<p class="help">추가 확인이 필요한 영역</p>${weak.slice(0,5).map(x=>`<div class="insight"><b>${esc(x.u.unit)}</b><div class="micro">${x.rs.filter(r=>r.correct).length}/${x.rs.length}개 정답 · 아래 단원 연습에서 추가 확인</div></div>`).join('')}`:'<div class="callout">진단 범위에서는 모두 맞혔어요! 사고력과 심화 문제로 확장해 보세요.</div>'}<p class="help">${wrongReasons?`오답 ${wr.length}개 중 원인을 선택한 ${wrongReasons}개에서 계산·오기 관련 자기보고는 ${care.length}개입니다.`:'오답 원인을 기록하면 계산 실수인지 개념 이해 문제인지 구분하는 데 도움이 됩니다.'}</p><p class="notice">정답만으로 부주의와 개념 부족을 자동 판별할 수 없습니다. 스스로 고른 오답 원인과 다시 풀기 결과를 함께 보세요.</p></div></div><div class="grid2" style="margin-top:18px"><div class="panel"><h3>📈 반복 진단 추이</h3>${hist.map((x,i)=>`<div class="barrow"><span>${dt(x.finishedAt)}</span><div class="track"><div class="fill" style="width:${score(x).pct}%"></div></div><b>${score(x).pct}%</b></div>`).join('')}<p class="micro">첫 진단은 표준화 검사가 아닙니다. 반복 응시와 같은 문제 기억 효과를 고려하세요.</p></div><div class="panel"><h3>🎯 다음 학습 추천</h3><p>${weak.length?`<b>${esc(weak[0].u.unit)}</b> 단원부터 10문제를 풀며 원인을 확인해 보세요.`:'기초 영역은 안정적으로 보입니다. 경시형 사고력을 도전해 보세요.'}</p><div class="inline-actions">${weak.length?`<button class="primary" onclick="start('practice','${weak[0].u.unit_id}')">취약 단원 연습</button>`:''}<button class="soft" onclick="start('challenge')">경시형 도전</button><button class="soft" onclick="start('review')">오답 다시풀기</button></div></div></div><div class="panel" style="margin-top:18px"><h3>최근 진단 답안 및 원인 분석</h3>${s.responses.map((r,i)=>reviewHTML(r,i,s.id)).join('')}</div>`}
let lessonUnit=null;
function openLesson(id){lessonUnit=id;page='lesson';render();window.scrollTo({top:0,behavior:'smooth'})}
function unitStatus(id){let rs=state.sessions.filter(s=>s.mode==='practice'&&s.unitId===id).flatMap(s=>s.responses).filter(r=>byId[r.qid]?.unit_id===id);let ok=rs.filter(r=>r.correct).length;return new Set(rs.map(r=>r.qid)).size>=3&&new Set(state.sessions.filter(s=>s.mode==='practice'&&s.unitId===id).map(s=>s.id)).size>=2&&ok/rs.length>=.8?'적용 문제까지 확인':rs.length?'학습 중':'시작 전'}
function unitsPage(){let g4=DB.units.filter(u=>u.term.startsWith('4-')),g5=DB.units.filter(u=>u.term==='5-1');let cards=us=>`<div class="unitgrid">${us.map(u=>`<article class="unit"><small>${esc(u.term)} · ${esc(u.domain)}</small><h3 style="margin:8px 0">${esc(u.unit)}</h3><p class="micro">${unitStatus(u.unit_id)}</p><button class="soft" onclick="openLesson('${u.unit_id}')">개념부터 보기 →</button></article>`).join('')}</div>`;return `<div class="section-head"><h2>📚 단계별 수학 학습</h2></div><div class="panel"><h3>학습 순서</h3><p>① 첫 진단 → ② 약한 초4 개념 복습 → ③ 초5-1 한 단원씩 개념·기본·적용 → ④ 사고력 문제와 풀이 설명 → ⑤ 준비되면 초5-2 다음 단원</p><p class="help">연산 문제집은 짧게 꾸준히 사용하고, 웹에서는 개념을 말로 설명하고 문제를 해결하는 연습에 집중해요.</p></div><div class="section-head"><h2>초4 기초 확인</h2><small>빈틈을 채우는 단계</small></div>${cards(g4)}<div class="section-head"><h2>초5-1 선행</h2><small>한 번에 한 단원씩</small></div>${cards(g5)}<div class="panel" style="margin-top:20px"><h3>🏆 사고력·경시 준비</h3><p class="help">답을 빨리 맞히는 것보다 조건을 표시하고, 다른 풀이를 찾아보고, 왜 맞는지 설명하는 습관을 먼저 만들어요. 본 문제는 경시대회 기출문제가 아닌 자체 제작 연습문항입니다.</p><div class="inline-actions"><button class="secondary" onclick="start('challenge',null,1)">입문 3문제</button><button class="secondary" onclick="start('challenge',null,2)">발전 5문제</button><button class="secondary" onclick="start('challenge',null,3)">경시형 심화</button></div></div>`}
function lessonPage(){let u=DB.units.find(u=>u.unit_id===lessonUnit);if(!u)return unitsPage();return `<div class="section-head"><h2>${esc(u.term)} · ${esc(u.unit)}</h2></div><div class="panel"><span class="tag blue">1단계 · 개념</span><h3 style="margin-top:12px">핵심 개념</h3><p>${esc(u.concept)}</p><div class="insight"><b>예제</b><p>${esc(u.example)}</p></div><p class="help">확인: ${esc(u.check)}</p></div><div class="grid2" style="margin-top:18px"><div class="panel"><span class="tag">2단계 · 기본</span><h3 style="margin:12px 0">개념을 직접 써 보기</h3><p class="help">연습장에 방법을 적고 답을 입력해요. 힌트와 해설을 볼 수 있어요.</p><button class="secondary" onclick="start('practice','${u.unit_id}',1)">기본 문제 풀기</button></div><div class="panel"><span class="tag gold">3단계 · 적용</span><h3 style="margin:12px 0">조건을 읽고 해결하기</h3><p class="help">식이나 그림을 먼저 만들고 풀이 이유를 말해 보세요.</p><button class="secondary" onclick="start('practice','${u.unit_id}',2)">적용 문제 풀기</button></div></div><div class="panel" style="margin-top:18px"><h3>다음 단계로 넘어갈 때</h3><p class="help">문제 하나를 맞혔다고 끝내지 않아요. 다른 수로 다시 풀고, 왜 그런지 설명할 수 있는지 확인하세요. 5-1 단원은 이전 단원과 4학년 관련 개념에 큰 빈틈이 없을 때 진행해요.</p><button class="soft" onclick="setPage('units')">전체 단원 보기</button></div>`}
function visual(q){if(!q.visual)return '';let v=q.visual,labels=v.labels,vals=v.values,top=Math.max(...vals)+4;if(v.type==='bar')return `<div class="graph" role="img" aria-label="막대그래프: ${labels.map((x,i)=>x+' '+vals[i]+v.unit).join(', ')}"><div class="bars">${labels.map((x,i)=>`<div class="barcol"><span>${vals[i]}${esc(v.unit)}</span><div style="height:${Math.round(vals[i]/top*125)}px"></div><b>${esc(x)}</b></div>`).join('')}</div></div>`;return `<div class="graph" role="img" aria-label="꺾은선그래프: ${labels.map((x,i)=>x+' '+vals[i]+v.unit).join(', ')}"><svg viewBox="0 0 350 160" aria-hidden="true"><polyline fill="none" stroke="#2c9676" stroke-width="4" points="${vals.map((n,i)=>`${35+i*95},${140-Math.round(n/top*110)}`).join(' ')}"/>${vals.map((n,i)=>`<circle cx="${35+i*95}" cy="${140-Math.round(n/top*110)}" r="5" fill="#2c9676"/><text x="${35+i*95}" y="${125-Math.round(n/top*110)}" text-anchor="middle">${n}${esc(v.unit)}</text><text x="${35+i*95}" y="155" text-anchor="middle">${esc(labels[i])}</text>`).join('')}</svg></div>`}

function parent(){let last=latestDiag();return `<div class="section-head"><h2>👨‍👩‍👦 부모님 대시보드</h2><small>학습 기록은 이 기기에만 저장됩니다.</small></div><div class="grid2"><div class="panel"><h3>데이터 관리</h3><p class="help">학습 기록을 JSON 파일로 내보내 ChatGPT에 업로드하면 보다 자세한 분석을 요청할 수 있어요. 기록에는 답안과 학습 시간 등이 포함됩니다.</p><div class="inline-actions" style="margin:19px 0"><button class="secondary" onclick="exportResults()">⬇️ 학습 기록 내보내기</button><button class="soft" onclick="document.getElementById('importFile').click()">⬆️ 기록 가져오기</button><input id="importFile" type="file" accept=".json,application/json" class="hide"></div><div class="divider"></div><button class="danger" onclick="clearAll()">이 기기의 기록 삭제</button></div><div class="panel"><h3>이렇게 활용해 주세요</h3><p>① 도움 없이 20문항 첫 진단<br>② 틀린 개념을 말로 설명하고 예제 풀기<br>③ 기존 연산 문제집은 하루 10분 안팎으로 병행<br>④ 초5-1은 개념→기본→적용 순서로 진행<br>⑤ 사고력은 주 1~2회 풀이 이유까지 설명<br>⑥ 2~4주 뒤 다시 진단</p><p class="notice">첫 진단은 한 영역당 약 1문항인 작은 표본입니다. 단원별 추가 학습과 아이의 풀이 설명을 함께 보세요. 문제은행 버전과 반복 응시 효과도 고려해야 합니다.</p></div></div><div class="panel" style="margin-top:18px"><h3>완료한 미션 기록</h3>${state.sessions.length?`<div class="table-wrap"><table><thead><tr><th>날짜</th><th>유형</th><th>점수</th><th>시간</th><th></th></tr></thead><tbody>${[...state.sessions].reverse().slice(0,30).map(s=>`<tr><td>${dt(s.finishedAt)}</td><td>${s.mode==='diagnostic'?'진단':s.mode==='challenge'?'경시 도전':s.mode==='review'?'오답 복습':'연습'}</td><td>${score(s).num}/${score(s).total}</td><td>${Math.ceil(s.responses.reduce((a,r)=>a+r.seconds,0)/60)}분</td><td><button class="miniBtn" onclick="showSession('${s.id}')">결과 보기</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="help">아직 완료한 미션이 없어요.</p>'}</div><div class="panel" style="margin-top:18px"><h3>개인정보와 사용 범위</h3><p class="help">로그인/서버/광고/외부 학습 데이터 전송 기능이 없습니다. 다만 학습 중인 브라우저의 로컬 저장소를 지우거나 기기를 바꾸면 기록이 사라질 수 있으므로 주기적으로 내보내기 해주세요. 공개 GitHub Pages에 올려도 문제와 정답 데이터는 누구나 열람할 수 있으며, 실제 상업 서비스에는 서버 측 채점과 계정·보안 설계가 추가로 필요합니다.</p></div>`}
function empty(msg){return `<div class="empty panel"><div class="emoji">📘</div><h2>${esc(msg)}</h2><button class="primary" onclick="setPage('home')">홈으로</button></div>`}
function exportResults(){let out={product:'하준이 수학 탐험',version:DB.version,exportedAt:new Date().toISOString(),sessions:state.sessions,xp:state.xp};let blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='하준이_수학학습기록_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function clearAll(){if(confirm('모든 학습 기록을 이 기기에서 삭제할까요? 이 작업은 되돌릴 수 없어요.')){state={sessions:[],active:null,xp:0};save();page='home';render()}}
function showSession(id){window.finishedId=id;page='finish';render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{let n=e.target.closest('.navbtn');if(n){setPage(n.dataset.page);return}let a=e.target.closest('[data-answer]');if(a){enterSelection(a.dataset.answer);return}if(e.target.closest('#submitbutton')){if(submitted)advance();else submit();return}if(e.target.closest('#hintbutton')){let q=current();let t=document.getElementById('hintbox');if(t){hintUsed=true;t.innerHTML='<b>💡 힌트</b> '+esc(q.hint);t.classList.remove('hide')}return}});
document.addEventListener('input',e=>{if(e.target.id==='ans')enterSelection(e.target.value)});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans'&&selected.trim()&&state.active){e.preventDefault();if(!submitted)submit();else advance()}});document.addEventListener('change',e=>{let el=e.target;if(el.matches('[data-reason-session]')){let s=state.sessions.find(s=>s.id===el.dataset.reasonSession);if(s&&s.responses[Number(el.dataset.reasonIndex)]){s.responses[Number(el.dataset.reasonIndex)].errorReason=el.value;save()}}if(el.id==='importFile'&&el.files[0]){let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!Array.isArray(x.sessions)||!x.sessions.every(s=>Array.isArray(s.responses)))throw Error('기록 형식 오류');if(!confirm('현재 학습 기록을 가져온 파일로 교체할까요?'))return;state={sessions:x.sessions,active:null,xp:Number(x.xp)||0};save();render();alert('가져왔습니다.')}catch(e){alert('올바른 기록 파일인지 확인해 주세요.')}};reader.readAsText(el.files[0])}});
window.start=start;window.setPage=setPage;window.openLesson=openLesson;window.resumeQuiz=resumeQuiz;window.exportResults=exportResults;window.clearAll=clearAll;window.showSession=showSession;document.getElementById('homeLogo').addEventListener('click',e=>{e.preventDefault();setPage('home')});
if(state.active&&state.active.questions?.length){page='quiz';resetQ()}render();
</script></body></html>
