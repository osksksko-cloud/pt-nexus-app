<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>하준 러너 · 매일 수학</title>
<style>
:root{--ink:#1d2a44;--sub:#5a6680;--line:#dfe5f0;--bg:#f2f5fb;--blue:#2f5bd3;--green:#1f9d63;--red:#d44a4a;--gold:#f2b632;--orange:#ff7a1a;--soft:#eef3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
header{background:linear-gradient(135deg,#ff7a1a,#ff4d6d);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
header b{font-size:20px}
header nav a,header nav button{color:#fff;text-decoration:none;background:rgba(255,255,255,.22);border:0;border-radius:10px;padding:8px 12px;font-size:15px;margin-left:6px}
main{max-width:820px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
h2{font-size:21px;margin:0 0 10px}h3{font-size:18px;margin:0 0 8px}
.muted{color:var(--sub);font-size:15px}
.btn{display:inline-block;border:0;border-radius:16px;padding:14px 20px;font-size:19px;font-weight:800;background:var(--blue);color:#fff;text-decoration:none;margin:4px 6px 4px 0}
.btn.big{font-size:24px;padding:20px 28px;width:100%;margin:6px 0}
.btn.orange{background:linear-gradient(135deg,#ff7a1a,#ff4d6d)}.btn.green{background:var(--green)}.btn.ghost{background:var(--soft);color:var(--blue)}.btn.small{font-size:15px;padding:9px 13px}
.btn:disabled{opacity:.4}
/* 캐릭터 */
.hero{display:flex;align-items:center;gap:16px}
.avatar{font-size:64px;width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#fff1d6,#ffd28a);display:flex;align-items:center;justify-content:center;flex:none}
.bar{height:16px;background:#e8edf7;border-radius:10px;overflow:hidden;margin:6px 0;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ff7a1a);border-radius:10px;transition:width 1s ease}
.dots{display:flex;gap:8px;margin:8px 0}.dots span{width:34px;height:34px;border-radius:50%;background:#e8edf7;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--sub)}
.dots span.on{background:var(--green);color:#fff}
/* 실력 게이지 */
.gauge{margin:10px 0}
.gauge .top{display:flex;justify-content:space-between;align-items:baseline}
.gauge .num{font-size:34px;font-weight:900}
.gauge .delta{font-size:20px;font-weight:900;color:var(--green)}
.gauge .g{height:22px;background:#e8edf7;border-radius:12px;position:relative;overflow:hidden}
.gauge .g .was{position:absolute;left:0;top:0;bottom:0;background:#b9c7ea;border-radius:12px}
.gauge .g .now{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3ccf8e,#1f9d63);border-radius:12px;transition:width 1.2s ease}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:8px}
.ulist div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px}
.ulist div.cur{border:2px solid var(--orange);background:#fff6ee}.ulist div.lock{opacity:.45}
.ulist .bar{height:8px;margin:4px 0 0}.ulist .bar i{background:linear-gradient(90deg,#3ccf8e,#1f9d63)}
/* 주간 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.week div{border-radius:12px;background:#eef1f7;padding:6px 0;font-size:13px;color:var(--sub)}
.week div b{display:block;font-size:17px;color:var(--ink)}
.week div.t{outline:3px solid var(--orange)}.week div.done{background:#e6f7ee}
.reward{background:#fff8e6;border:1px solid #f4dfa4;border-radius:14px;padding:12px;margin-top:10px}
/* 레이스 트랙 */
.track{position:sticky;top:0;z-index:5;background:#1d2a44;color:#fff;padding:10px 14px}
.lane{display:flex;align-items:center;gap:4px}
.lane .c{flex:1;height:38px;border:0;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;padding:0}
.lane .c.done{background:#5b7bd8}.lane .c.ok{background:#3ccf8e}.lane .c.no{background:#ff6b6b}.lane .c.now{outline:3px solid #ffd76a}
.lane .flag{font-size:24px;border:0;background:none;padding:0 4px;border-radius:8px}.lane .flag.now{outline:3px solid #ffd76a}
.qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.qtop>b{background:var(--ink);color:#fff;border-radius:10px;padding:2px 10px}
.navrow{display:flex;justify-content:space-between;max-width:460px;margin:10px auto 0}.navrow .btn{margin:0}
.submit button.picked{outline:4px solid #ffd76a}.submit.one{grid-template-columns:1fr}
.srow{display:grid;grid-template-columns:34px 1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;font-size:16px}
.srow .sq{word-break:keep-all}.srow .sa{font-weight:800;text-align:right}.srow.empty .sa{color:var(--red)}
.srow.okrow{grid-template-columns:34px 1fr auto}.srow.norow{grid-template-columns:34px 1fr auto;background:#fff6f6}
.tinfo{display:flex;justify-content:space-between;font-size:15px;margin-top:6px}
.combo{color:#ffd76a;font-weight:900}
/* 문제 */
.q{font-size:24px;font-weight:700;margin:4px 0 12px;line-height:1.5;word-break:keep-all}
.q.arith{font-size:38px;text-align:center;font-weight:900}
.q img{display:block;max-width:100%;margin:10px auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.72em;line-height:1.1;margin:0 3px}
.fr span:first-child{border-bottom:3px solid currentColor;padding:0 4px}
.box{display:inline-block;width:1.2em;height:1.1em;border:3px solid currentColor;border-radius:6px;vertical-align:middle}
.ansbox{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
.ansbox .v{min-width:200px;max-width:80%;min-height:62px;font-size:34px;font-weight:800;border:3px solid #ff9a4d;border-radius:16px;padding:6px 14px;text-align:center;background:#fffaf5}
.ansbox .v.empty{color:#c3c9d6;font-weight:600;font-size:22px;line-height:46px}
.ansbox .u{font-size:24px;color:var(--sub)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:8px auto 0}
.pad button{height:66px;border:0;border-radius:14px;background:#eef1f7;font-size:28px;font-weight:800;color:var(--ink)}
.pad button:active{background:#d9e1f2;transform:scale(.97)}
.pad button.fn{font-size:18px;background:#e3e8f3}
.submit{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:460px;margin:12px auto 0}
.submit button{height:70px;border:0;border-radius:16px;font-size:21px;font-weight:900;color:#fff}
.submit .sure{background:var(--green)}.submit .maybe{background:#8a94ab}
.msg{color:var(--red);text-align:center;min-height:24px;font-size:16px}
.fb{border-radius:16px;padding:16px;margin-top:10px}
.fb.ok{background:#e6f7ee;border:2px solid #bfe8d2}.fb.no{background:#fdeeee;border:2px solid #f3c9c9}
.fb ol{margin:6px 0 0;padding-left:22px;font-size:16px}
.cause{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cause button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 4px;font-size:16px;font-weight:700}
.tag{display:inline-block;font-size:13px;padding:2px 9px;border-radius:10px;background:#eef1f7;color:var(--sub)}
.tag.o{background:#fff1e3;color:#c45a00}.tag.g{background:#dff5ea;color:var(--green)}
/* 결과·몸풀기 */
.stars{font-size:52px;text-align:center;letter-spacing:4px}
.pop{animation:pop .5s ease}@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.boom{font-size:22px;font-weight:900;text-align:center;color:var(--orange)}
.move{text-align:center}.move .e{font-size:90px}.move .t{font-size:60px;font-weight:900;color:var(--orange)}
.setrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.setrow input[type=text],.setrow input[type=number]{font-size:17px;padding:8px 10px;border:2px solid var(--line);border-radius:10px}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar i,.gauge .g .now{transition:none}}
@media (max-width:520px){.q{font-size:21px}.q.arith{font-size:30px}.pad button{height:58px}}
</style>
</head>
<body>
<header><b>🏃 하준 러너 · 매일 수학</b><nav><a href="start.html">시작화면</a><a href="drill.html">⚡ 연산</a><button onclick="go('parent')">부모님</button></nav></header>
<div id="track"></div>
<main id="app"><div class="card">불러오는 중…</div></main>
<script src="mission_data.js"></script>
<script src="progress.js"></script>
<script src="notify.js"></script>
<script src="grading.js"></script>
<script src="arith_gen.js"></script>
<script>
/* ---------------------------------------------------------------
   평일 매일 학습 — 짧은 판(약 7~8분) × 1~3판
   - 2판 필수(하루 공부양 2배, 2026-11-24), 3판은 선택. 내일 수업을 미리 하면 그만큼 더. 판 사이 1분 몸풀기.
   - 한 판(기본 6문제): 연산 1 → 지금 단원 4 (중간에 같은 학년 앞 단원 섞어 풀기 1, 없으면 지금 단원). 지난번 못 끝낸 오답 유형이 있으면 먼저 1개.
   - 시험지 방식: 문제 사이를 오가며 답을 고칠 수 있고, 📝 제출을 눌러야 한꺼번에 채점 (2026-11-12 피드백 반영).
   - 답마다 '😎 확실해요' / '🤔 아마도' 표시 → 아마도로 맞힌 것은 실력 게이지에 덜 반영, 확실했는데 틀리면 '덜렁 실수' 신호.
   - 채점 뒤 틀린 문제마다 풀이 → 원인 고르기 → 바로 숫자 바뀐 같은 유형 다시 도전.
   - 판이 끝나면 지금 단원 실력 게이지(0~100)가 오늘 시작보다 얼마나 올랐는지 바로 보여 준다.
   - 기록: localStorage 'hajun_math_mission_v1' (미션·연산 훈련과 같은 저장소)
---------------------------------------------------------------- */
const D = window.MISSION_DATA, P = window.PROGRESS, G = window.GRADING, AR = window.ARITH, STORE = 'hajun_math_mission_v1';
const byId = {}, byFam = {}, byUnit = {};
D.questions.forEach(q => { byId[q.id] = q; (byFam[q.f] ||= []).push(q); (byUnit[q.u] ||= []).push(q); });
const unitById = Object.fromEntries(D.units.map(u => [u.id, u]));

let S; try { S = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { S = {}; }
S = Object.assign({grade:4, unitId:null, xpAwards:{}, seen:{}, attempts:[], wrong:[], days:{}, active:null, review:null}, S);
S.settings = Object.assign({openAll:false, opened:{}}, S.settings || {});
S.settings.daily = Object.assign({grade:5, perRound:6, weekGoal:15, reward:'주말에 게임 30분 더 (부모님과 약속)'}, S.settings.daily || {});
S.daily = Object.assign({log:[], bestCombo:0, unit:null}, S.daily || {});
function save(){ try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { alert('기록 저장에 실패했어요.'); } }

const ds = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => ds(new Date());
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ---------- 경험치 (미션과 같은 하루 50XP 한도) ---------- */
function dayXP(){ return Object.entries(S.xpAwards).filter(([k]) => k.startsWith(today()+'|') && !k.endsWith('|drill')).reduce((a,[,v])=>a+v,0); }
function award(key){ const k = today()+'|'+key; if (S.xpAwards[k]) return 0; const room = P.xpCap(S) - dayXP(); if (room <= 0) return 0; S.xpAwards[k] = Math.min(10, room); return S.xpAwards[k]; }

/* ---------- 캐릭터 (모은 별로 성장) ---------- */
const FORMS = [[0,'🐣','새싹 러너'],[10,'🏃','러너'],[30,'🚴','사이클 러너'],[60,'🏎️','레이서'],[100,'🚀','로켓 러너'],[160,'🦸','수학 히어로'],[250,'🏆','전설의 챔피언']];
function totalStars(){ return S.daily.log.reduce((a,r)=>a+r.stars,0); }
function form(st){ let i = 0; FORMS.forEach((f,k) => { if (st >= f[0]) i = k; }); return {i, emoji:FORMS[i][1], name:FORMS[i][2], next:FORMS[i+1]}; }

/* ---------- 단원 정하기 ---------- */
function dGrade(){ return S.settings.daily.grade || 5; }
function curUnit(){
  return P.dailyUnit(S, D);   // 오늘의 미션과 같은 단원
}
// 단원 → 연산 몸풀기 기술
const UNIT_SKILL = {'5-1-1':'g5-mixed','5-1-2':'g5-gcd','5-1-3':'g5-mixed','5-1-4':'g5-gcd','5-1-5':'g5-fracadd','5-1-6':'g4-mul','5-2-1':'g4-addsub','5-2-2':'g5-fracmul','5-2-3':'g4-div','5-2-4':'g5-decmul','5-2-5':'g4-mul','5-2-6':'g4-div',
  '6-1-1':'g6-fracdiv','6-1-3':'g6-decdiv','6-1-4':'g6-percent','6-2-1':'g6-fracdiv','6-2-2':'g6-decdiv','6-2-4':'g6-ratio'};
function warmSkill(uid){ if (UNIT_SKILL[uid]) return UNIT_SKILL[uid]; const r = P.drillRecommend(S, D, unitById[uid].g); return r ? r.id : 'mul-table'; }   // 매핑 없는 단원: 순서상 지금 익히는 연산

/* ---------- 문제 고르기 ---------- */
function pickFromFamily(fam, avoid){ const pool = byFam[fam] || []; const free = pool.filter(q => !avoid.includes(q.id)); const un = free.filter(q => !S.seen[q.id]); const src = un.length ? un : free; return src.length ? src[rnd(0, src.length-1)] : null; }
function pickInUnit(uid, d, avoid, avoidFam){
  const fams = shuffle([...new Set((byUnit[uid]||[]).filter(q => q.d === d).map(q => q.f))]);
  const order = [...fams.filter(f => !avoidFam.includes(f)), ...fams.filter(f => avoidFam.includes(f))];
  for (const f of order) { const q = pickFromFamily(f, avoid); if (q) return q; }
  return null;
}
function lastPracticed(uid){ for (let i = S.attempts.length-1; i >= 0; i--) if (S.attempts[i].u === uid) return S.attempts[i].date; return ''; }
function reviewUnit(uid){
  const g = unitById[uid].g, order = D.units.filter(u => u.g === g).map(u => u.id), i = order.indexOf(uid);
  // 순서대로: 같은 학년에서 이미 배운 앞 단원만 복습 (다른 학기·다른 학년 문제로 갑자기 넘어가지 않음)
  const pool = new Set(order.slice(0, Math.max(0,i)).filter(x => P.unitStage(S, D, x).stage >= 1));
  const list = [...pool].filter(x => byUnit[x]);
  list.sort((a,b) => lastPracticed(a).localeCompare(lastPracticed(b)) || Math.random() - .5);   // 가장 오래 안 본 단원
  return list[0] || null;
}
function buildRound(){
  const uid = curUnit(), st = P.unitStage(S, D, uid).stage, n = S.settings.daily.perRound;
  const pattern = P.focus(S, D, uid).pattern;   // 🎯 단원 진도 + 마무리 테스트 결과에 맞춘 난이도 순서
  const items = [], avoid = [], usedFam = [];
  const add = (q, role, extra) => { if (!q) return; avoid.push(q.id); usedFam.push(q.f); items.push(Object.assign({kind:'bank', qid:q.id, role}, extra||{})); };
  // 0) 연산 몸풀기 1문제
  items.push({kind:'arith', p: AR.makeSet(warmSkill(uid))[0], skill: warmSkill(uid)});
  // 1) 지난번 못 끝낸 오답 유형 1개 (숫자 바꾼 새 문제)
  const w = S.wrong.find(x => (x.repair === 'pending' || x.repair === 'todo') && byFam[x.f] && x.u && x.u.split('-')[0] === uid.split('-')[0] && x.u <= uid);   // 같은 학년·지금까지 배운 단원의 오답만
  if (w) add(pickFromFamily(w.f, [w.qid]), 'repair', {wqid: w.qid});
  // 2) 지금 단원 + 섞어 풀기 1
  const nUnit = Math.max(2, n - items.length - 1);
  for (let k = 0; k < nUnit; k++) add(pickInUnit(uid, pattern[k % pattern.length], avoid, usedFam), 'unit');
  const ru = reviewUnit(uid);
  const rq = ru && pickInUnit(ru, rnd(1,2), avoid, []);
  if (rq) items.splice(Math.max(2, items.length - 1), 0, {kind:'bank', qid:rq.id, role:'review'});
  else add(pickInUnit(uid, pattern[nUnit % pattern.length], avoid, usedFam), 'unit');   // 복습할 앞 단원이 없으면 지금 단원 1문제 더
  items.forEach(it => { it.input = ''; it.conf = null; });
  return {date: today(), phase: 'solve', unit: uid, items, idx: 0, msg: '', combo: 0, maxCombo: 0, firstOk: 0, counted: 0, sureWrong: 0,
          startScore: P.unitScore(S, D, uid, today()), round: todayRounds() + 1, startedAt: Date.now()};
}

/* ---------- 진행: 시험지처럼 풀고 → 📝 제출하면 한꺼번에 채점 → 틀린 문제 고치기 ----------
   phase 'solve'  : 문제 사이를 자유롭게 오가며 답을 쓰고 고칠 수 있다 (채점 전)
   phase 'sheet'  : 답안 확인 (안 푼 문제·고칠 문제 확인 후 제출)
   phase 'graded' : 채점 결과 한눈에
   phase 'fix'    : 틀린 문제마다 풀이 → 원인 고르기 → 숫자 바뀐 새 문제로 바로 다시 도전 */
let page = 'home', R = null, moveT = null;
function todayRounds(){ return S.daily.log.filter(r => r.date === today()).length; }
// 꼭 할 판 수 = 하루 공부양(기본 2판) × 오늘 몇 번째 수업인지. 그다음 한 판은 선택
function needRounds(){ return P.dose(S) * P.lessonNo(S); }
function maxRounds(){ return needRounds() + 1; }
function go(p){ page = p; render(); window.scrollTo(0,0); }
function keep(){ S.daily.cur = (R && R.date === today() && !R.result) ? R : null; save(); }   // 새로고침해도 이어서 풀 수 있게
function startRound(){ R = buildRound(); page = 'round'; keep(); render(); window.scrollTo(0,0); }
function resumeRound(){ R = S.daily.cur; page = 'round'; render(); window.scrollTo(0,0); }
function curItem(){ return R.items[R.idx]; }
function qOf(it){ return it.kind === 'bank' ? byId[it.qid] : null; }
// 지금 자판이 쓰는 칸: 풀기 중이면 그 문제, 고치기 중이면 다시 도전 문제
function slot(){ if (!R) return null; if (R.phase === 'solve') return curItem(); if (R.phase === 'fix' && R.fstep === 'retry') return R.items[R.fixQ[R.fi]].retry; return null; }
function press(k){
  const s = slot(); if (!s) return;
  let v = s.input || '';
  if (k === 'del') v = v.slice(0, -1);
  else if (k === 'clr') v = '';

function gradeItem(it){
  const text = (it.input || '').trim();

      if (!g.ok && (it.role === 'unit' || it.role === 'review')) { if (!S.wrong.some(w => w.qid === q.id)) S.wrong.push({qid:q.id, v:q.v, f:q.f, u:q.u, date:today(), repair:'todo', sat:'todo', ans:text}); }
      if (it.role === 'repair') S.wrong.filter(w => w.f === q.f && w.repair !== 'success').forEach(w => { if (g.ok) { w.repair = 'success'; w.repairDate = today(); } else w.repair = 'pending'; });
    } else if (!g.ok) {

function startFix(){ if (!R.fixQ.length) return finishRound(); R.phase = 'fix'; R.fi = 0; R.fstep = 'why'; keep(); render(); window.scrollTo(0,0); }
function setCause(c){
  const it = R.items[R.fixQ[R.fi]]; it.cause = c;

function checkRetry(){

    <button class="btn big green" id="nextBtn" onclick="nextFix()" style="margin-top:10px">${R.fi + 1 < R.fixQ.length ? '다음 고치기 →' : '결과 보기 →'}</button></div>`;
}
function gaugeHTML(label, was, now){
  const d = now - was;
  return `<div class="gauge"><div class="top"><span><b>${label}</b></span><span><span class="num">${now}</span><span class="muted"> / 100</span> ${d > 0 ? `<span class="delta pop">▲ ${d}</span>` : d < 0 ? `<span class="muted">▼ ${-d}</span>` : ''}</span></div>
    <div class="g"><div class="was" style="width:${Math.max(was, 0)}%"></div><div class="now" id="gnow" style="width:${now}%"></div></div>
    <div class="muted" style="font-size:13px">오늘 시작 ${was} → 지금 ${now}${d > 0 ? ' · 실력이 올라갔어요!' : ''}</div></div>`;
}
function resultView(){
  const {rec, xp, newCombo, evolved} = R.result, u = unitById[rec.unit], f = form(totalStars()), rounds = todayRounds();
  const msg = rec.stars === 3 ? '완벽한 레이스! 🏅' : rec.stars === 2 ? '아주 잘 달렸어요! 🥈' : '끝까지 완주! 다음 판엔 꼼꼼하게 🏃';
  const cards = [];
  if (newCombo) cards.push(`<div class="boom pop">🔥 연속 정답 신기록! ${rec.combo}연속</div>`);
  if (evolved) cards.push(`<div class="boom pop">✨ 진화! 이제 ${f.emoji} ${f.name}!</div>`);
  if (rec.sureWrong) cards.push(`<p class="muted" style="text-align:center">😮 '확실해요'였는데 틀린 문제 ${rec.sureWrong}개 — 내기 전에 한 번 더 보면 별이 늘어요!</p>`);
  return `<div class="card" style="text-align:center"><div class="muted">${rec.round}판 결과</div>
      <div class="stars pop">${'⭐'.repeat(rec.stars)}<span style="opacity:.2">${'⭐'.repeat(3 - rec.stars)}</span></div>
      <h2 style="margin:4px 0">${msg}</h2><div class="muted">첫 번에 정답 ${rec.firstOk} / ${rec.n} · ${Math.floor(rec.sec/60)}분 ${rec.sec%60}초${xp ? ` · +${xp} XP` : ''}</div>${cards.join('')}</div>
    <div class="card"><h3>📈 실력 게이지</h3>${gaugeHTML(`${u.g}-${u.s} ${esc(u.title)}`, rec.startScore, rec.score)}</div>
    <div class="card" style="text-align:center">
      ${P.courseBanner(S, D)}
      ${rounds < needRounds() ? `<div class="boom" style="color:var(--blue)">${rounds}판 완료! 오늘은 ${needRounds()}판까지 해요</div><button class="btn big orange" onclick="startMove()">💪 몸풀기 1분 → ${rounds + 1}판 시작</button>`
        : rounds === needRounds() ? `<div class="boom" style="color:var(--green)">✅ 오늘 레이스 ${rounds}판 완료!</div><button class="btn ghost" onclick="startMove()">💪 몸풀기 1분 → ${rounds + 1}판 더 (선택)</button>`
        : `<div class="boom">🏆 오늘 ${rounds}판 완주! 최고예요!</div>`}</div>`;
}
function moveView(){
  const mv = render._move;
  return `<div class="card move"><h2>몸풀기 타임!</h2><div class="e">${mv.m[0]}</div><h2>${mv.m[1]}</h2>
    <div class="t">${mv.left > 0 ? mv.left : '👍'}</div>
    <button class="btn big orange" ${mv.left > 0 ? 'disabled' : ''} onclick="startRound()">${mv.left > 0 ? '몸을 움직여요…' : '다 했어요! ' + (todayRounds() + 1) + '판 시작 ▶'}</button>
    <button class="btn ghost" onclick="clearInterval(moveT);go('home')">오늘은 그만</button></div>`;
}
function weekDates(){ const d = new Date(), w = (d.getDay() + 6) % 7, mon = new Date(d); mon.setDate(d.getDate() - w); return [...Array(7)].map((_, i) => { const x = new Date(mon); x.setDate(mon.getDate() + i); return ds(x); }); }
function homeView(){
  const st = totalStars(), f = form(st), rounds = todayRounds(), uid = curUnit(), u = unitById[uid];
  const nextNeed = f.next ? f.next[0] - st : 0, prog = f.next ? Math.round((st - FORMS[f.i][0]) / (f.next[0] - FORMS[f.i][0]) * 100) : 100;
  const wd = weekDates(), wStars = S.daily.log.filter(r => wd.includes(r.date)).reduce((a,r)=>a+r.stars,0), goal = S.settings.daily.weekGoal;
  const cell = (d, i) => { const L = S.daily.log.filter(r => r.date === d), s = L.reduce((a,r)=>a+r.stars,0); return `<div class="${d === today() ? 't' : ''} ${L.length ? 'done' : ''}">${'월화수목금토일'[i]}<b>${L.length ? '⭐' + s : (d < today() && i < 5 ? '·' : '')}</b>${L.length ? L.length + '판' : ''}</div>`; };
  const was = P.unitScore(S, D, uid, today()), now = P.unitScore(S, D, uid), stage = P.unitStage(S, D, uid);
  const ulist = D.units.filter(x => x.g === dGrade()).map(x => { const open = P.unitOpen(S, D, x.id), sc = P.unitScore(S, D, x.id);
    return `<div class="${x.id === uid ? 'cur' : ''} ${open ? '' : 'lock'}">${open ? (P.unitStage(S, D, x.id).stage ? P.unitStage(S, D, x.id).icon : '🏁') : '🔒'} ${x.g}-${x.s} ${esc(x.title)}<div class="bar"><i style="width:${sc}%"></i></div><span class="muted" style="font-size:12px">${open ? sc + '점' : '앞 단원 🌿 후'}</span></div>`; }).join('');
  return `<div class="card"><div class="hero"><div class="avatar">${f.emoji}</div><div style="flex:1">
      <div style="font-size:22px;font-weight:900">하준 · ${f.name}</div>
      <div class="bar"><i style="width:${prog}%"></i></div>
      <div class="muted">⭐ ${st}개 모음${f.next ? ` · ${nextNeed}개 더 모으면 ${f.next[1]} ${f.next[2]}로 진화!` : ' · 최고 단계!'} · 🔥 최고 ${S.daily.bestCombo}연속</div></div></div></div>
    <div class="card"><h2>오늘의 레이스</h2>
      <div class="dots">${[...Array(maxRounds())].map((_, k) => k + 1).map(i => `<span class="${rounds >= i ? 'on' : ''}">${rounds >= i ? '✓' : i}</span>`).join('')}<span style="background:none;width:auto" class="muted">${rounds >= maxRounds() ? rounds + '판 완주!' : rounds >= needRounds() ? `꼭 할 ${needRounds()}판 완료 · ${maxRounds()}판은 선택` : `${needRounds()}판은 꼭 · ${maxRounds()}판은 선택`}</span></div>
      <div class="muted">지금 단원: <b>${u.g}-${u.s} ${esc(u.title)}</b> ${stage.stage ? stage.icon : ''} · 한 판 ${S.settings.daily.perRound}문제쯤 (약 7분)</div>
      ${S.daily.cur && S.daily.cur.date === today() ? `<button class="btn big orange" onclick="resumeRound()">▶ ${S.daily.cur.round}판 이어서 풀기 (${S.daily.cur.phase === 'solve' || S.daily.cur.phase === 'sheet' ? '제출 전' : '고치기 중'})</button>`
        : rounds >= maxRounds() ? '<div class="boom">🏆 오늘은 충분히 달렸어요!</div>' : `<button class="btn big orange" onclick="startRound()">▶ ${rounds + 1}판 시작${rounds >= needRounds() ? ' (선택)' : ''}</button>`}</div>
    <div class="card"><h2>📈 실력 게이지</h2>${gaugeHTML(`${u.g}-${u.s} ${esc(u.title)}`, was, now)}
      <div class="muted" style="margin:4px 0 10px">${esc(stage.next)}</div><div class="ulist">${ulist}</div></div>
    <div class="card"><h2>이번 주</h2><div class="week">${wd.map(cell).join('')}</div>
      <div class="reward"><b>🎁 이번 주 목표: 별 ${goal}개</b> → ${esc(S.settings.daily.reward)}<div class="bar"><i style="width:${Math.min(100, wStars / goal * 100)}%"></i></div>
      <div class="muted">${wStars >= goal ? '🎉 목표 달성! 부모님께 보여 드려요' : `지금 ⭐ ${wStars} / ${goal} · ${goal - wStars}개 남았어요`}</div></div></div>`;
}
function parentView(){
  const ds_ = S.settings.daily, g = ds_.grade, uid = curUnit();
  const L = S.daily.log.slice(-60), recent = [...L].reverse().slice(0, 12);
  const att = S.attempts.filter(a => a.src === 'daily'), sureWrong = att.filter(a => !a.ok && a.conf === 'sure').length, maybeOk = att.filter(a => a.ok && a.conf === 'maybe').length;
  const causes = {calc:'😵 계산 실수', read:'📖 잘못 읽음', dontknow:'🤔 몰랐어요'}, cc = {}; att.forEach(a => { if (a.cause) cc[a.cause] = (cc[a.cause]||0) + 1; });
  return `<div class="card"><h2>👪 부모님 설정</h2>
    <div class="muted">학년</div><div class="setrow">${[4,5,6].map(x => `<button class="btn small ${g === x ? '' : 'ghost'}" onclick="S.settings.daily.grade=${x};S.grade=${x};S.daily.unit=null;save();render()">${x}학년${x === 5 ? ' (선행)' : ''}</button>`).join('')}</div>
    <div class="muted">지금 단원 (열린 단원만 고를 수 있어요. 순서대로 열리고, 앞 단원이 🌿가 되면 다음 단원이 열려요)</div>
    <div class="setrow">${D.units.filter(u => u.g === g).map(u => { const open = P.unitOpen(S, D, u.id); return `<button class="btn small ${u.id === uid ? '' : 'ghost'}" ${open ? '' : 'disabled'} onclick="S.daily.unit='${u.id}';if(!(S.active&&S.active.date===today()))S.unitId='${u.id}';save();render()">${u.g}-${u.s} ${esc(u.title)}</button>`; }).join('')}</div>
    <div class="muted">하루 공부양 (연산·레이스 판 수와 미션 문제 수)</div><div class="setrow">${[[2,'많이 (기본) · 연산·레이스 2판 + 미션 기본 10·응용 5 · 약 1시간'],[1,'적게 · 1판씩 + 미션 기본 2·응용 2 · 약 27분']].map(([x,t]) => `<button class="btn small ${P.dose(S) === x ? '' : 'ghost'}" onclick="S.settings.dose=${x};save();render()">${t}</button>`).join('')}</div>
    <div class="muted">한 판 문제 수</div><div class="setrow">${[5,6,8].map(x => `<button class="btn small ${ds_.perRound === x ? '' : 'ghost'}" onclick="S.settings.daily.perRound=${x};save();render()">${x}문제${x === 6 ? ' (기본)' : ''}</button>`).join('')}</div>
    <div class="muted">주간 목표 별과 약속 보상 (1판에 별 1~3개, 평일 5일 × 1판 ≈ 별 10~15개)</div>
    <div class="setrow"><input type="number" min="3" max="45" value="${ds_.weekGoal}" style="width:90px" onchange="S.settings.daily.weekGoal=Math.max(1,+this.value||15);save()"> 개 →
      <input type="text" value="${esc(ds_.reward)}" style="flex:1;min-width:200px" onchange="S.settings.daily.reward=this.value;save()"></div>
    <a class="btn small" href="parent.html">👪 진행 상황·틀린 문제 보기</a></div>
    <div class="card"><h3>매일 학습 기록</h3>
      <p class="muted">‘확실해요’ 했는데 틀림: <b>${sureWrong}</b> (덜렁 실수 신호, 줄어들면 좋아요) · ‘아마도’로 맞힘: <b>${maybeOk}</b> (아직 확실히 모름)<br>틀린 이유: ${Object.entries(cc).map(([k,v]) => `${causes[k]} ${v}`).join(' · ') || '아직 없음'}</p>
      ${recent.length ? `<table style="width:100%;border-collapse:collapse;font-size:14px"><tr><th align="left">날짜</th><th align="left">단원</th><th align="left">결과</th><th align="left">게이지</th></tr>${recent.map(r => `<tr><td>${r.date.slice(5).replace('-','/')} ${r.round}판</td><td>${esc(unitById[r.unit]?.title||'')}</td><td>${'⭐'.repeat(r.stars)} ${r.firstOk}/${r.n}</td><td>${r.startScore}→${r.score}</td></tr>`).join('')}</table>` : '<p class="muted">아직 기록이 없어요.</p>'}</div>
    <button class="btn ghost" onclick="go('home')">← 돌아가기</button>`;
}
// 실제 키보드(블루투스 키보드 포함)도 쓸 수 있게
document.addEventListener('keydown', e => {
  if (page !== 'round' || !R) return;
  if (e.target && e.target.tagName === 'INPUT') return;
  const nb = $('nextBtn');
  if (!slot()) { if (e.key === 'Enter' && nb) { e.preventDefault(); nb.click(); } return; }
  if (/^[0-9./]$/.test(e.key)) press(e.key); else if (e.key === ' ') { e.preventDefault(); press('sp'); } else if (e.key === 'Backspace') { e.preventDefault(); press('del'); }
  else if (e.key === 'Enter') { e.preventDefault(); R.phase === 'solve' ? pickConf('sure') : checkRetry(); }
  else if (R.phase === 'solve' && e.key === 'ArrowLeft') move(-1); else if (R.phase === 'solve' && e.key === 'ArrowRight') move(1);
});
if (!D || !P || !G || !AR) $('app').innerHTML = '<div class="card">필요한 파일(mission_data.js, progress.js, grading.js, arith_gen.js)을 찾지 못했어요.</div>';
else { if (S.daily.cur && S.daily.cur.date !== today()) { S.daily.cur = null; save(); }
  if (location.hash === '#start' && S.daily.cur) resumeRound(); else if (location.hash === '#start' && todayRounds() < maxRounds()) startRound(); else if (location.hash === '#parent') go('parent'); else render(); }
</script>
