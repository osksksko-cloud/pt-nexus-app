name: Keep Supabase awake

# Supabase 무료 요금제는 7일 동안 데이터베이스 요청이 없으면 프로젝트를 자동으로
# 일시정지시킨다. 이 워크플로는 주 2회(월·목) Supabase에 가벼운 조회 요청을 보내
# "사용 중" 상태를 유지시켜 자동 일시정지를 막는다.
#
# 사용하는 키는 앱 화면(index.html)에 이미 공개되어 있는 publishable key이며,
# RLS(행 수준 보안)로 보호되어 익명 요청으로는 타인의 데이터를 읽을 수 없다.

on:
  schedule:
    # 매주 월요일, 목요일 00:10 UTC (한국시간 오전 9시 10분)
    - cron: '10 0 * * 1,4'
  workflow_dispatch:   # 필요할 때 수동 실행용

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          SUPA_URL="https://mkhmpqubpityqflzlarf.supabase.co"
          SUPA_KEY="sb_publishable_kGIX88F_ZVymVjc0d18yHw_oIeJF1pe"

          code=$(curl -s -o /tmp/resp.txt -w '%{http_code}' \
            "$SUPA_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPA_KEY" \
            -H "Authorization: Bearer $SUPA_KEY")

          echo "HTTP $code"
          cat /tmp/resp.txt

          if [ "$code" != "200" ]; then
            echo "::error::Supabase ping failed (HTTP $code) - 프로젝트가 일시정지되었거나 키가 변경되었을 수 있음"
            exit 1
          fi

          echo "Supabase 정상 응답 - 자동 일시정지 타이머 초기화됨"
